                                            <button 
                                                onClick={() => {
                                                    const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                                                    handleUpdateJobInModal({
                                                        ...selectedJob,
                                                        status: 'On Site',
                                                        timeLogs: { ...selectedJob.timeLogs, startTime: now }
                                                    });
                                                }}
                                                className={`p-3 rounded-xl border text-center transition flex flex-col items-center justify-center ${selectedJob.timeLogs?.startTime ? 'bg-emerald-50 border-emerald-300' : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-md'}`}
                                            >
                                                <span className={`text-[11px] font-extrabold uppercase ${selectedJob.timeLogs?.startTime ? 'text-emerald-800' : 'text-white'}`}>▶ Start Job</span>
                                                <span className={`text-xs font-bold mt-0.5 ${selectedJob.timeLogs?.startTime ? 'text-emerald-900' : 'text-emerald-100'}`}>
                                                    {selectedJob.timeLogs?.startTime ? `Started: ${selectedJob.timeLogs.startTime}` : 'Click to Start'}
                                                </span>
                                            </button>

                                            <button 
                                                onClick={() => {
                                                    const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                                                    handleUpdateJobInModal({
                                                        ...selectedJob,
                                                        status: 'Completed',
                                                        column: 'Completed',
                                                        timeLogs: { ...selectedJob.timeLogs, completeTime: now }
                                                    });
                                                }}
                                                className={`p-3 rounded-xl border text-center transition flex flex-col items-center justify-center ${selectedJob.timeLogs?.completeTime ? 'bg-red-50 border-red-300' : 'bg-rose-600 hover:bg-rose-700 text-white shadow-md'}`}
                                            >
                                                <span className={`text-[11px] font-extrabold uppercase ${selectedJob.timeLogs?.completeTime ? 'text-red-800' : 'text-white'}`}>✓ Complete Job</span>
                                                <span className={`text-xs font-bold mt-0.5 ${selectedJob.timeLogs?.completeTime ? 'text-red-900' : 'text-rose-100'}`}>
                                                    {selectedJob.timeLogs?.completeTime ? `Finished: ${selectedJob.timeLogs.completeTime}` : 'Click to Complete'}
                                                </span>
                                            </button>
                                        </div>
                                    </div>

                                    {/* DOCUMENTS VAULT */}
                                    <div className="space-y-3 bg-indigo-50/50 border border-indigo-200 p-4 rounded-xl">
                                        <div className="flex justify-between items-center">
                                            <h4 className="font-bold text-xs uppercase text-[#1B365D]">📂 Client & Job Documents Vault</h4>
                                            <span className="text-[10px] font-extrabold px-2 py-0.5 rounded bg-indigo-100 text-indigo-800">
                                                PDF, DOCX, XLSX
                                            </span>
                                        </div>

                                        <div className="space-y-1.5 max-h-36 overflow-y-auto">
                                            {(selectedJob.documents || []).map((doc) => (
                                                <div key={doc.id} className="flex justify-between items-center bg-white p-2.5 rounded-lg border text-xs shadow-2xs">
                                                    <div className="flex items-center space-x-2 truncate">
                                                        <span className="text-base">📄</span>
                                                        <div>
                                                            <span className="font-bold text-gray-800 truncate block">{doc.name}</span>
                                                            <span className="text-[10px] text-gray-400 font-semibold">{doc.size}</span>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center space-x-2">
                                                        <a href={doc.url} download={doc.name} className="bg-indigo-100 hover:bg-indigo-200 text-indigo-800 px-2 py-1 rounded font-bold text-[10px]">
                                                            Download
                                                        </a>
                                                        <button 
                                                            onClick={() => handleDeleteDocument(doc.id)}
                                                            className="text-red-500 hover:text-red-700 font-extrabold px-1 text-sm"
                                                            title="Delete Document"
                                                        >
                                                            &times;
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                            {(!selectedJob.documents || selectedJob.documents.length === 0) && (
                                                <p className="text-xs text-gray-400 italic">No files or client briefs uploaded yet.</p>
                                            )}
                                        </div>

                                        <div className="pt-1 border-t border-indigo-200/60">
                                            <label className="border-2 border-dashed border-indigo-300 hover:border-[#00AEEF] rounded-lg p-3 flex flex-col items-center justify-center cursor-pointer bg-white transition text-center">
                                                <span className="text-xl">📁</span>
                                                <span className="text-xs font-bold text-[#1B365D] mt-1">Upload Client Briefs, Permits, or Specs</span>
                                                <span className="text-[10px] text-gray-400">Click to browse files from your computer or device</span>
                                                <input type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.txt" onChange={handleFileUpload} className="hidden" />
                                            </label>
                                        </div>
                                    </div>

                                    {/* MATERIALS USED */}
                                    <div className="space-y-3 bg-blue-50/60 border border-blue-200 p-4 rounded-xl">
                                        <div className="flex justify-between items-center">
                                            <h4 className="font-bold text-xs uppercase text-[#1B365D]">📦 Materials Used & Inventory Log</h4>
                                            <span className="text-[10px] font-extrabold px-2 py-0.5 rounded bg-blue-100 text-blue-800">
                                                Active Staff Access
                                            </span>
                                        </div>

                                        <div className="space-y-1.5 max-h-36 overflow-y-auto">
                                            {(selectedJob.materialsUsed || []).map((mat) => (
                                                <div key={mat.id} className="flex justify-between items-center bg-white p-2 rounded-lg border text-xs shadow-2xs">
                                                    <span className="font-semibold text-gray-800">{mat.item}</span>
                                                    <div className="flex items-center space-x-3">
                                                        <span className="font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded text-[11px]">Qty: {mat.qty}</span>
                                                        <button 
                                                            onClick={() => handleDeleteMaterialFromJob(mat.id)}
                                                            className="text-red-500 hover:text-red-700 font-extrabold px-1 text-sm"
                                                            title="Remove Item"
                                                        >
                                                            &times;
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                            {(!selectedJob.materialsUsed || selectedJob.materialsUsed.length === 0) && (
                                                <p className="text-xs text-gray-400 italic">No materials logged for this job yet.</p>
                                            )}
                                        </div>

                                        <div className="flex flex-wrap gap-2 pt-1 border-t border-blue-200/60">
                                            <select 
                                                value={newMaterialItem} 
                                                onChange={(e) => setNewMaterialItem(e.target.value)}
                                                className="flex-1 px-2 py-1.5 border rounded-lg text-xs bg-white font-medium"
                                            >
                                                {masterPartsCatalog.map((part) => (
                                                    <option key={part.id} value={part.name}>{part.name} ({part.sku})</option>
                                                ))}
                                            </select>
                                            <input 
                                                type="number" 
                                                min="1" 
                                                value={newMaterialQty} 
                                                onChange={(e) => setNewMaterialQty(e.target.value)}
                                                className="w-16 px-2 py-1.5 border rounded-lg text-xs bg-white font-bold text-center"
                                            />
                                            <button 
                                                onClick={handleAddMaterialToJob}
                                                className="bg-[#1B365D] hover:bg-[#152a4b] text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow-xs"
                                            >
                                                + Add Item
                                            </button>
                                        </div>
                                    </div>

                                    {/* SWMS SECTION */}
                                    <div className="border border-amber-200 bg-amber-50/50 p-4 rounded-xl space-y-3">
                                        <div className="flex justify-between items-center">
                                            <h4 className="font-bold text-xs uppercase text-amber-900">🛡️ SWMS Compliance & Sign-off</h4>
                                            <select 
                                                value={selectedJob.swmsTemplateTitle || 'Replacement Inverter'}
                                                onChange={(e) => handleUpdateJobInModal({...selectedJob, swmsTemplateTitle: e.target.value})}
                                                className="px-2 py-1 border rounded text-xs bg-white font-bold text-amber-900"
                                            >
                                                {swmsTemplates.map(s => <option key={s.title} value={s.title}>{s.title}</option>)}
                                            </select>
                                        </div>

                                        <div className="space-y-1 text-xs text-gray-700 bg-white p-3 rounded-lg border">
                                            <p className="font-bold text-[#1B365D] mb-1">Identified Hazards & Control Measures:</p>
                                            <ul className="list-disc pl-4 space-y-0.5">
                                                {template.hazards.map((h, i) => <li key={i}>{h}</li>)}
                                            </ul>
                                            <p className="font-bold text-[#1B365D] mt-2 mb-1">Mandatory Checkpoints:</p>
                                            <ul className="list-decimal pl-4 space-y-0.5">
                                                {template.steps.map((step, i) => <li key={i}>{step}</li>)}
                                            </ul>
                                        </div>

                                        <div className="space-y-2 pt-1">
                                            <p className="text-[11px] font-bold text-gray-700 uppercase">Crew Sign-Off Status:</p>
                                            <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                                                {(selectedJob.assignedTechs || []).map(tech => {
                                                    const sig = selectedJob.swmsSignatures?.[tech] || { signed: false };
                                                    const isCurrentTech = tech === username;
                                                    return (
                                                        <div key={tech} className="flex justify-between items-center p-2 bg-white border rounded-lg text-xs">
                                                            <div>
                                                                <span className="font-bold">{tech}</span>
                                                                <span className={`block text-[10px] ${sig.signed ? 'text-green-600 font-semibold' : 'text-amber-600 font-semibold'}`}>
                                                                    {sig.signed ? `Signed (${sig.timestamp})` : '⚠️ Pending Signature'}
                                                                </span>
                                                            </div>
                                                            {isCurrentTech && !sig.signed && (
                                                                <button 
                                                                    onClick={() => {
                                                                        const updatedSigs = {
                                                                            ...(selectedJob.swmsSignatures || {}),
                                                                            [tech]: { signed: true, timestamp: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) }
                                                                        };
                                                                        handleUpdateJobInModal({...selectedJob, swmsSignatures: updatedSigs});
                                                                    }}
                                                                    className="bg-amber-600 hover:bg-amber-700 text-white px-2.5 py-1 rounded text-[10px] font-bold shadow-xs"
                                                                >
                                                                    Sign SWMS
                                                                </button>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>

                                    {/* NOTES LOG */}
                                    <div className="space-y-3 bg-gray-50 p-4 rounded-xl border">
                                        <h4 className="font-bold text-xs uppercase text-[#1B365D]">📝 Job Notes Log</h4>
                                        <div className="space-y-2 max-h-40 overflow-y-auto">
                                            {(selectedJob.notesLog || []).map((note, idx) => (
                                                <div key={idx} className="bg-white p-2.5 rounded-lg border text-xs space-y-1 shadow-xs">
                                                    <div className="flex justify-between text-[10px] text-gray-400 font-bold">
                                                        <span>{note.author}</span>
                                                        <span>{note.timestamp}</span>
                                                    </div>
                                                    <p className="text-gray-700">{note.text}</p>
                                                </div>
                                            ))}
                                            {(!selectedJob.notesLog || selectedJob.notesLog.length === 0) && (
                                                <p className="text-xs text-gray-400 italic">No notes recorded yet.</p>
                                            )}
                                        </div>
                                        <div className="flex gap-2">
                                            <input 
                                                type="text"
                                                value={selectedJob.newNoteText || ''}
                                                onChange={(e) => handleUpdateJobInModal({...selectedJob, newNoteText: e.target.value})}
                                                placeholder="Type a note or observation..."
                                                className="flex-1 px-3 py-2 border rounded-lg text-xs bg-white"
                                            />
                                            <button 
                                                onClick={() => {
                                                    if (!selectedJob.newNoteText || !selectedJob.newNoteText.trim()) return;
                                                    const newNote = {
                                                        author: username,
                                                        timestamp: new Date().toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit'}),
                                                        text: selectedJob.newNoteText.trim()
                                                    };
                                                    const updatedLog = [...(selectedJob.notesLog || []), newNote];
                                                    handleUpdateJobInModal({...selectedJob, notesLog: updatedLog, newNoteText: ''});
                                                }}
                                                className="bg-[#1B365D] hover:bg-[#152a4b] text-white px-4 py-2 rounded-lg text-xs font-bold"
                                            >
                                                Add Note
                                            </button>
                                        </div>
                                    </div>

                                    {/* PHOTO LOCKER */}
                                    <div className="space-y-3 bg-gray-50 p-4 rounded-xl border">
                                        <h4 className="font-bold text-xs uppercase text-[#1B365D]">📷 On-Site Photo Locker</h4>
                                        <div className="grid grid-cols-3 gap-2">
                                            {(selectedJob.photos || []).map((photoUrl, idx) => (
                                                <div key={idx} className="relative aspect-square bg-gray-200 rounded-lg overflow-hidden border">
                                                    <img src={photoUrl} alt="Site capture" className="w-full h-full object-cover" />
                                                </div>
                                            ))}
                                            <label className="border-2 border-dashed border-gray-300 hover:border-[#00AEEF] rounded-lg aspect-square flex flex-col items-center justify-center cursor-pointer bg-white transition p-1 text-center">
                                                <span className="text-lg">📸</span>
                                                <span className="text-[10px] font-bold text-[#1B365D] mt-1">Take Photo (Camera)</span>
                                                <input type="file" accept="image/*" capture="environment" onChange={handlePhotoUpload} className="hidden" />
                                            </label>
                                            <label className="border-2 border-dashed border-gray-300 hover:border-[#00AEEF] rounded-lg aspect-square flex flex-col items-center justify-center cursor-pointer bg-white transition p-1 text-center">
                                                <span className="text-lg">🖼️</span>
                                                <span className="text-[10px] font-bold text-[#1B365D] mt-1">Upload (Gallery)</span>
                                                <input type="file" accept="image/*" multiple onChange={handlePhotoUpload} className="hidden" />
                                            </label>
                                        </div>
                                    </div>

                                    <div className="flex justify-end pt-2">
                                        <button onClick={() => setSelectedJob(null)} className="bg-[#1B365D] text-white px-5 py-2 rounded-lg text-xs font-bold shadow hover:bg-[#152a4b]">Save & Close</button>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* CREATE JOB MODAL */}
                    {showCreateModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 space-y-4">
                                <h3 className="font-bold text-sm uppercase text-[#1B365D]">Create & Dispatch Job</h3>
                                <form onSubmit={handleCreateJob} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Client Name</label>
                                        <div className="relative">
                                            <input 
                                                type="text" 
                                                value={newJobClient}
                                                onChange={(e) => handleClientInput(e.target.value)}
                                                placeholder="Type customer name..."
                                                className="w-full px-3 py-2 border rounded-lg text-xs bg-white font-medium"
                                                required
                                            />
                                            {clientSuggestions.length > 0 && !isClientSelected && (
                                                <div className="absolute z-20 left-0 right-0 mt-1 bg-white border rounded-lg shadow-lg max-h-40 overflow-y-auto">
                                                    {clientSuggestions.map((c, i) => (
                                                        <div key={i} onClick={() => selectExistingClient(c)} className="px-3 py-2 text-xs hover:bg-blue-50 cursor-pointer border-b last:border-b-0">
                                                            <strong>{c.name}</strong> <span className="text-gray-400 block text-[10px]">{c.address}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                            {newJobClient.trim().length > 0 && clientSuggestions.length === 0 && !isClientSelected && (
                                                <div className="absolute z-20 left-0 right-0 mt-1 bg-amber-50 border border-amber-200 p-2.5 rounded-lg shadow-lg text-xs space-y-2">
                                                    <p className="text-amber-900 font-semibold">Customer not found. Would you like to add this customer?</p>
                                                    <div className="flex space-x-2">
                                                        <button 
                                                            type="button" 
                                                            onClick={addNewClientToDatabase}
                                                            className="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1 rounded font-bold text-[10px]"
                                                        >
                                                            Yes, Save Customer
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Job Scope / Title</label>
                                        <input type="text" value={newJobTitle} onChange={(e) => setNewJobTitle(e.target.value)} placeholder="e.g. Inverter Replacement" className="w-full px-3 py-2 border rounded-lg text-xs" required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Site Address</label>
                                        <input type="text" value={newJobAddress} onChange={(e) => setNewJobAddress(e.target.value)} placeholder="Full address" className="w-full px-3 py-2 border rounded-lg text-xs" required />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Primary Tech (Color)</label>
                                            <select value={newJobPrimaryTech} onChange={(e) => setNewJobPrimaryTech(e.target.value)} className="w-full px-2 py-1.5 border rounded-lg text-xs">
                                                <option value="">-- Unassigned --</option>
                                                {teamMembers.map(m => <option key={m.name} value={m.name}>{m.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">SWMS Template</label>
                                            <select value={newJobSwmsTemplate} onChange={(e) => setNewJobSwmsTemplate(e.target.value)} className="w-full px-2 py-1.5 border rounded-lg text-xs">
                                                {swmsTemplates.map(s => <option key={s.title} value={s.title}>{s.title}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Date</label>
                                        <input type="date" value={newJobDate} onChange={(e) => setNewJobDate(e.target.value)} className="w-full px-3py-2 border rounded-lg text-xs" required />
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button type="button" onClick={() => setShowCreateModal(false)} className="px-3 py-1.5 border rounded-lg text-xs">Cancel</button>
                                        <button type="submit" className="bg-[#1B365D] text-white px-4 py-1.5 rounded-lg text-xs font-bold">Save Job</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
