<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megawatt Power - Field Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FIREBASE SDK SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyB8rWkwquB6taF4Pjss3Jwa5viJ1KCoPHo",
            authDomain: "megawatt-a68a8.firebaseapp.com",
            projectId: "megawatt-a68a8",
            storageBucket: "megawatt-a68a8.firebasestorage.app",
            messagingSenderId: "619892735313",
            appId: "1:619892735313:web:2063e4fee26f181da06770",
            measurementId: "G-0S2H504BQK"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        function App() {
            const [currentUser, setCurrentUser] = React.useState(null);
            const [userRole, setUserRole] = React.useState('Field Tech');
            const [authEmail, setAuthEmail] = React.useState('');
            const [authPassword, setAuthPassword] = React.useState('');
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [activeTab, setActiveTab] = React.useState('schedule');
            
            // First time login name setup modal state
            const [showNameModal, setShowNameModal] = React.useState(false);
            const [profileInputName, setProfileInputName] = React.useState('');

            const [scheduleView, setScheduleView] = React.useState('week');
            const [currentDate, setCurrentDate] = React.useState(new Date());
            const [filterMyJobsOnly, setFilterMyJobsOnly] = React.useState(false);
            const [globalSearchQuery, setGlobalSearchQuery] = React.useState('');

            const [notifications, setNotifications] = React.useState([]);
            const [pingMessage, setPingMessage] = React.useState('');
            const [pingTargetTech, setPingTargetTech] = React.useState('');

            const [teamMembers, setTeamMembers] = React.useState([]);
            const [inviteEmail, setInviteEmail] = React.useState('');
            const [inviteName, setInviteName] = React.useState('');
            const [inviteRole, setInviteRole] = React.useState('Field Tech');
            const [isInviting, setIsInviting] = React.useState(false);

            const [swmsTemplates, setSwmsTemplates] = React.useState([
                {
                    title: 'Solar Panel Installation',
                    hazards: ['Working at Heights (Roof Fall Risks)', 'Electrical Shock from PV DC Array', 'Manual Handling & Solar Panel Weight'],
                    steps: ['Inspect roof anchor points and harness gear', 'Erect edge protection scaffolding', 'Isolate DC strings before connection']
                },
                {
                    title: 'Replacement Inverter',
                    hazards: ['High Voltage DC/AC Arc Flash', 'Heavy Lifting (Inverter Chassis)', 'Working in Confined Plant Rooms'],
                    steps: ['Perform Lockout/Tagout (LOTO) on AC isolators', 'Verify zero voltage on DC terminals', 'Decommission old unit and mount replacement']
                },
                {
                    title: 'Battery Install',
                    hazards: ['Lithium-ion Battery Fire/Thermal Runaway', 'DC Short Circuit Hazards', 'Heavy Cabinet Placement'],
                    steps: ['Check ventilation clearance and fire rating', 'Mount battery enclosure securely', 'Connect DC breaker and BMS communication cables']
                },
                {
                    title: 'Service Job',
                    hazards: ['General Electrical Shock', 'Switchboard Vermin/Asbestos check', 'Ladders & Trip Hazards'],
                    steps: ['Perform visual inspection of switchboard internals', 'Thermal imaging scan for hot joints', 'Test RCD trip times']
                }
            ]);

            const [masterPartsCatalog, setMasterPartsCatalog] = React.useState([
                { id: 1, sku: 'MC4-PAIR', name: 'MC4 Connectors (Pair)', category: 'Connectors', unit: 'Pair' },
                { id: 2, sku: 'DC-CAB-6', name: '6mm² Solar DC Cable (Meters)', category: 'Cabling', unit: 'Meters' },
                { id: 3, sku: 'EARTH-10', name: '10mm² Earth Wire (Meters)', category: 'Cabling', unit: 'Meters' },
                { id: 4, sku: 'INV-3PH-5', name: '3-Phase 5kW Hybrid Inverter', category: 'Inverters', unit: 'Unit' },
                { id: 5, sku: 'PW3-EXP', name: 'Tesla Powerwall 3 Expansion Unit', category: 'Batteries', unit: 'Unit' },
                { id: 6, sku: 'ISO-32A', name: '32A AC Isolator Switch', category: 'Switchgear', unit: 'Unit' }
            ]);
            const [partsSearchQuery, setPartsSearchQuery] = React.useState('');
            const [newPartName, setNewPartName] = React.useState('');
            const [newPartSku, setNewPartSku] = React.useState('');
            const [newPartCategory, setNewPartCategory] = React.useState('Cabling');
            const [newPartUnit, setNewPartUnit] = React.useState('Unit');
            const [editingPartId, setEditingPartId] = React.useState(null);

            const [jobs, setJobs] = React.useState([]);
            const [clients, setClients] = React.useState([]);

            const [selectedJob, setSelectedJob] = React.useState(null);
            const [showCreateModal, setShowCreateModal] = React.useState(false);
            const [newJobTitle, setNewJobTitle] = React.useState('');
            const [newJobClient, setNewJobClient] = React.useState('');
            const [newJobAddress, setNewJobAddress] = React.useState('');
            
            const [clientSuggestions, setClientSuggestions] = React.useState([]);
            const [isClientSelected, setIsClientSelected] = React.useState(false);

            const [newJobPrimaryTech, setNewJobPrimaryTech] = React.useState('');
            const [newJobAssignedTechs, setNewJobAssignedTechs] = React.useState([]);
            const [newJobSwmsTemplate, setNewJobSwmsTemplate] = React.useState('Replacement Inverter');
            const [newJobDate, setNewJobDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [draggedJobId, setDraggedJobId] = React.useState(null);

            const [newMaterialItem, setNewMaterialItem] = React.useState(masterPartsCatalog[0]?.name || '');
            const [newMaterialQty, setNewMaterialQty] = React.useState(1);

            const colorPalette = [
                'bg-blue-50 border-blue-300 text-blue-900',
                'bg-amber-50 border-amber-300 text-amber-900',
                'bg-emerald-50 border-emerald-300 text-emerald-900',
                'bg-purple-50 border-purple-300 text-purple-900',
                'bg-cyan-50 border-cyan-300 text-cyan-900',
                'bg-rose-50 border-rose-300 text-rose-900',
                'bg-indigo-50 border-indigo-300 text-indigo-900'
            ];

            // Listen to Firebase Auth state
            React.useEffect(() => {
                const unsubscribeAuth = auth.onAuthStateChanged(async (user) => {
                    if (user) {
                        setCurrentUser(user);
                        setIsLoggedIn(true);

                        const userRef = db.collection('users').doc(user.uid);
                        const doc = await userRef.get();
                        
                        if (doc.exists && doc.data().name) {
                            setUserRole(doc.data().access || 'Field Tech');
                            setShowNameModal(false);
                        } else {
                            setShowNameModal(true);
                        }
                    } else {
                        setCurrentUser(null);
                        setIsLoggedIn(false);
                        setShowNameModal(false);
                    }
                });
                return () => unsubscribeAuth();
            }, []);

            // Sync Firestore Collections
            React.useEffect(() => {
                if (!isLoggedIn) return;

                const unsubJobs = db.collection('jobs').onSnapshot(snapshot => {
                    setJobs(snapshot.docs.map(doc => ({ ...doc.data(), docId: doc.id })));
                }, err => console.error("Jobs sync error:", err));

                const unsubClients = db.collection('clients').onSnapshot(snapshot => {
                    setClients(snapshot.docs.map(doc => ({ ...doc.data(), docId: doc.id })));
                }, err => console.error("Clients sync error:", err));

                const unsubTeam = db.collection('users').onSnapshot(snapshot => {
                    const members = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setTeamMembers(members);
                    if (members.length > 0 && !pingTargetTech) {
                        setPingTargetTech(members[0].name || members[0].email);
                    }
                }, err => console.error("Team sync error:", err));

                return () => {
                    unsubJobs();
                    unsubClients();
                    unsubTeam();
                };
            }, [isLoggedIn]);

            const isAdmin = userRole === 'Admin';

            const handleLogin = async (e) => {
                e.preventDefault();
                try {
                    await auth.signInWithEmailAndPassword(authEmail, authPassword);
                } catch (err) {
                    alert("Sign-in failed: " + err.message);
                }
            };

            const handleLogout = async () => {
                await auth.signOut();
                setIsLoggedIn(false);
            };

            const handleSaveFirstTimeProfile = async (e) => {
                e.preventDefault();
                if (!profileInputName.trim() || !currentUser) return;

                try {
                    const assignedColor = colorPalette[teamMembers.length % colorPalette.length];
                    const defaultAccess = currentUser.email === 'marcus@megawatt.com' ? 'Admin' : 'Field Tech';

                    await db.collection('users').doc(currentUser.uid).set({
                        email: currentUser.email,
                        name: profileInputName.trim(),
                        access: defaultAccess,
                        color: assignedColor,
                        joinedAt: new Date().toISOString()
                    }, { merge: true });

                    setUserRole(defaultAccess);
                    setShowNameModal(false);
                } catch (err) {
                    alert("Failed to save profile name: " + err.message);
                }
            };

            const handleSendInvite = async (e) => {
                e.preventDefault();
                if (!inviteEmail.trim()) return;
                setIsInviting(true);

                try {
                    const newUid = `user_${Date.now()}`;
                    const assignedColor = colorPalette[teamMembers.length % colorPalette.length];

                    await db.collection('users').doc(newUid).set({
                        email: inviteEmail.trim().toLowerCase(),
                        name: inviteName.trim() || inviteEmail.split('@')[0],
                        access: inviteRole,
                        color: assignedColor,
                        invitedAt: new Date().toISOString()
                    });

                    await auth.sendPasswordResetEmail(inviteEmail.trim());

                    alert(`Invitation link successfully sent to ${inviteEmail}!`);
                    setInviteEmail('');
                    setInviteName('');
                } catch (err) {
                    console.error("Invite error:", err);
                    alert("Invitation failed: " + err.message);
                } finally {
                    setIsInviting(false);
                }
            };

            const handleToggleUserRole = async (memberId, currentAccess) => {
                const newAccess = currentAccess === 'Admin' ? 'Field Tech' : 'Admin';
                try {
                    await db.collection('users').doc(memberId).update({ access: newAccess });
                } catch (err) {
                    alert("Role update failed: " + err.message);
                }
            };

            const handleClientInput = (val) => {
                setNewJobClient(val);
                setIsClientSelected(false);
                if (val.trim().length > 0) {
                    const matches = clients.filter(c => c.name.toLowerCase().includes(val.toLowerCase()));
                    setClientSuggestions(matches);
                } else {
                    setClientSuggestions([]);
                }
            };

            const selectExistingClient = (c) => {
                setNewJobClient(c.name);
                setNewJobAddress(c.address || '');
                setClientSuggestions([]);
                setIsClientSelected(true);
            };

            const addNewClientToDatabase = async () => {
                if (!newJobClient.trim()) return;
                const clientName = newJobClient.trim();
                const clientAddress = newJobAddress.trim() || 'Coffs Harbour NSW';
                
                try {
                    await db.collection('clients').add({ name: clientName, address: clientAddress });
                    if (!newJobAddress.trim()) setNewJobAddress(clientAddress);
                    setIsClientSelected(true);
                    setClientSuggestions([]);
                } catch (err) {
                    console.error("Error adding client:", err);
                }
            };

            const handleCreateJob = async (e) => {
                e.preventDefault();
                const initialSigs = {};
                newJobAssignedTechs.forEach(t => { initialSigs[t] = { signed: false, timestamp: '' }; });

                const currentYearShort = String(new Date().getFullYear()).slice(-2);
                const yearPrefix = `-${currentYearShort}`;
                
                const currentYearJobs = jobs.filter(j => j.id && j.id.endsWith(yearPrefix));
                let maxNum = 0;
                currentYearJobs.forEach(j => {
                    const numPart = parseInt(j.id.split('-')[0], 10);
                    if (!isNaN(numPart) && numPart > maxNum) maxNum = numPart;
                });
                const nextSeqNum = String(maxNum + 1).padStart(3, '0');
                const jobId = `${nextSeqNum}${yearPrefix}`;

                const clientName = newJobClient || 'General Client';
                const clientAddress = newJobAddress || 'Coffs Harbour NSW';

                const newJob = {
                    id: jobId,
                    title: newJobTitle || 'Electrical Service',
                    client: clientName,
                    address: clientAddress,
                    primaryTech: newJobPrimaryTech,
                    assignedTechs: newJobAssignedTechs,
                    date: newJobDate,
                    time: '09:00 AM',
                    status: newJobPrimaryTech ? 'Pending' : 'Unassigned',
                    column: 'Morning Dispatch',
                    swmsTemplateTitle: newJobSwmsTemplate,
                    swmsSignatures: initialSigs,
                    materialsUsed: [],
                    documents: [],
                    timeLogs: { startTime: '', completeTime: '' },
                    notesLog: [],
                    photos: [],
                    newNoteText: ''
                };

                try {
                    if (!clients.some(c => c.name.toLowerCase() === clientName.toLowerCase())) {
                        await db.collection('clients').add({ name: clientName, address: clientAddress });
                    }
                    await db.collection('jobs').doc(newJob.id).set(newJob);
                    setShowCreateModal(false);
                    setNewJobTitle('');
                    setNewJobClient('');
                    setNewJobAddress('');
                    setClientSuggestions([]);
                    setIsClientSelected(false);
                } catch (err) {
                    console.error("Failed to create job:", err);
                }
            };

            const handleSendPing = (e) => {
                e.preventDefault();
                if (!pingMessage.trim()) return;
                const newAlert = {
                    id: Date.now(),
                    recipient: pingTargetTech,
                    sender: currentUser?.email,
                    message: pingMessage.trim(),
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    read: false
                };
                setNotifications([newAlert, ...notifications]);
                setPingMessage('');
                alert(`Dispatch alert successfully sent to ${pingTargetTech}!`);
            };

            const handleAddMaterialToJob = () => {
                if (!selectedJob || !newMaterialItem) return;
                const existing = selectedJob.materialsUsed || [];
                const newItemObj = { id: Date.now(), item: newMaterialItem, qty: Number(newMaterialQty) || 1 };
                handleUpdateJobInModal({ ...selectedJob, materialsUsed: [...existing, newItemObj] });
            };

            const handleDeleteMaterialFromJob = (matId) => {
                if (!selectedJob) return;
                const updated = (selectedJob.materialsUsed || []).filter(m => m.id !== matId);
                handleUpdateJobInModal({ ...selectedJob, materialsUsed: updated });
            };

            const handleFileUpload = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0 || !selectedJob) return;

                const newDocs = files.map(file => {
                    let fileType = 'doc';
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (ext === 'pdf') fileType = 'pdf';
                    else if (['xls', 'xlsx', 'csv'].includes(ext)) fileType = 'sheet';

                    const sizeKb = (file.size / 1024).toFixed(0);
                    const sizeFormatted = sizeKb > 1024 ? `${(sizeKb / 1024).toFixed(1)} MB` : `${sizeKb} KB`;

                    return {
                        id: Date.now() + Math.random(),
                        name: file.name,
                        size: sizeFormatted,
                        type: fileType,
                        url: URL.createObjectURL(file)
                    };
                });

                const updatedDocs = [...(selectedJob.documents || []), ...newDocs];
                handleUpdateJobInModal({ ...selectedJob, documents: updatedDocs });
            };

            const handleDeleteDocument = (docId) => {
                if (!selectedJob) return;
                const updatedDocs = (selectedJob.documents || []).filter(d => d.id !== docId);
                handleUpdateJobInModal({ ...selectedJob, documents: updatedDocs });
            };

            const handleSaveMasterPart = (e) => {
                e.preventDefault();
                if (!newPartName.trim()) return;

                let updatedCatalog = [...masterPartsCatalog];
                if (editingPartId !== null) {
                    updatedCatalog = updatedCatalog.map(p => p.id === editingPartId ? {
                        ...p,
                        name: newPartName.trim(),
                        sku: newPartSku.trim() || p.sku,
                        category: newPartCategory,
                        unit: newPartUnit
                    } : p);
                    setEditingPartId(null);
                } else {
                    const newPartObj = {
                        id: Date.now(),
                        sku: newPartSku.trim() || `SKU-${Math.floor(Math.random()*9000+1000)}`,
                        name: newPartName.trim(),
                        category: newPartCategory,
                        unit: newPartUnit
                    };
                    updatedCatalog.push(newPartObj);
                }
                setMasterPartsCatalog(updatedCatalog);
                setNewPartName('');
                setNewPartSku('');
            };

            const handleEditMasterPart = (part) => {
                setEditingPartId(part.id);
                setNewPartName(part.name);
                setNewPartSku(part.sku);
                setNewPartCategory(part.category);
                setNewPartUnit(part.unit);
            };

            const handleDeleteMasterPart = (partId) => {
                setMasterPartsCatalog(masterPartsCatalog.filter(p => p.id !== partId));
                if (editingPartId === partId) {
                    setEditingPartId(null);
                    setNewPartName('');
                    setNewPartSku('');
                }
            };

            const handleNavigateTime = (direction) => {
                const newDate = new Date(currentDate);
                if (scheduleView === 'day') newDate.setDate(newDate.getDate() + direction);
                else if (scheduleView === 'week') newDate.setDate(newDate.getDate() + (direction * 7));
                else if (scheduleView === 'month') newDate.setMonth(newDate.getMonth() + direction);
                setCurrentDate(newDate);
                setNewJobDate(newDate.toISOString().split('T')[0]);
            };

            const handleDragStart = (e, jobId) => {
                setDraggedJobId(jobId);
                e.dataTransfer.setData('text/plain', jobId);
            };

            const handleDropOnDate = async (e, targetDate) => {
                e.preventDefault();
                if (!draggedJobId) return;
                const targetJob = jobs.find(j => j.id === draggedJobId);
                if (targetJob) {
                    const updated = { ...targetJob, date: targetDate };
                    await db.collection('jobs').doc(updated.id).set(updated);
                }
                setDraggedJobId(null);
            };

            const handleDropOnColumn = async (e, targetColumn) => {
                e.preventDefault();
                if (!draggedJobId) return;
                const targetJob = jobs.find(j => j.id === draggedJobId);
                if (targetJob) {
                    let newStatus = targetJob.status;
                    if (targetColumn === 'Completed') newStatus = 'Completed';
                    else if (targetColumn.includes('Dispatch')) newStatus = 'On Site';
                    const updated = { ...targetJob, column: targetColumn, status: newStatus };
                    await db.collection('jobs').doc(updated.id).set(updated);
                }
                setDraggedJobId(null);
            };

            const handleDragOver = (e) => { e.preventDefault(); };

            const handleUpdateJobInModal = async (updatedJob) => {
                setSelectedJob(updatedJob);
                await db.collection('jobs').doc(updatedJob.id).set(updatedJob);
            };

            const handlePhotoUpload = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0 || !selectedJob) return;
                const newPhotoUrls = files.map(file => URL.createObjectURL(file));
                const updatedPhotos = [...(selectedJob.photos || []), ...newPhotoUrls];
                handleUpdateJobInModal({ ...selectedJob, photos: updatedPhotos });
            };

            const displayedJobs = jobs.filter(job => {
                if (filterMyJobsOnly && !job.assignedTechs?.some(t => teamMembers.find(m => m.name === t)?.email === currentUser?.email)) return false;
                if (globalSearchQuery.trim().length > 0) {
                    const q = globalSearchQuery.toLowerCase();
                    return job.client?.toLowerCase().includes(q) || job.id?.toLowerCase().includes(q) || job.address?.toLowerCase().includes(q) || job.title?.toLowerCase().includes(q);
                }
                return true;
            });

            const filteredCatalog = masterPartsCatalog.filter(p => {
                if (!partsSearchQuery.trim()) return true;
                const q = partsSearchQuery.toLowerCase();
                return p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
            });

            const getTechColorStyle = (techName) => {
                if (!techName) return 'bg-gray-50 border-dashed border-gray-300 text-gray-500';
                const tech = teamMembers.find(m => m.name === techName);
                return tech ? tech.color : 'bg-gray-50 border-gray-200 text-gray-800';
            };

            const hasUnsignedSwms = (job) => {
                if (!job.assignedTechs || job.assignedTechs.length === 0) return false;
                return job.assignedTechs.some(tech => !job.swmsSignatures?.[tech]?.signed);
            };

            const openGoogleMaps = (address) => {
                if (!address) return;
                window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`, '_blank');
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-[#1B365D] flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border-t-4 border-[#00AEEF]">
                            <div className="p-8 text-center bg-gradient-to-b from-[#1B365D]/5 to-transparent">
                                <h1 className="text-2xl font-bold text-[#1B365D]">Megawatt Power</h1>
                                <p className="text-xs font-bold text-[#00AEEF] uppercase mt-1">Field Operations Portal</p>
                            </div>
                            <form onSubmit={handleLogin} className="p-8 pt-0 space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Email Address</label>
                                    <input 
                                        type="email" 
                                        value={authEmail}
                                        onChange={(e) => setAuthEmail(e.target.value)}
                                        placeholder="tech@megawatt.com"
                                        className="w-full px-3 py-2 border rounded-lg text-sm bg-gray-50"
                                        required
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Password</label>
                                    <input 
                                        type="password" 
                                        value={authPassword}
                                        onChange={(e) => setAuthPassword(e.target.value)}
                                        placeholder="••••••••"
                                        className="w-full px-3 py-2 border rounded-lg text-sm"
                                        required
                                    />
                                </div>
                                <button type="submit" className="w-full bg-[#1B365D] hover:bg-[#152a4b] text-white py-2.5 rounded-lg font-semibold text-sm transition shadow-md">
                                    Sign In
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col font-sans text-gray-800">
                    {/* FIRST-TIME NAME SETUP MODAL */}
                    {showNameModal && (
                        <div className="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 space-y-4 border-t-4 border-[#00AEEF]">
                                <div className="text-center">
                                    <h3 className="font-bold text-lg text-[#1B365D]">Welcome to Megawatt Power!</h3>
                                    <p className="text-xs text-gray-500 mt-1">Please enter your full name to set up your technician profile and roster card.</p>
                                </div>
                                <form onSubmit={handleSaveFirstTimeProfile} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Your Full Name</label>
                                        <input 
                                            type="text" 
                                            value={profileInputName} 
                                            onChange={(e) => setProfileInputName(e.target.value)} 
                                            placeholder="e.g. Marcus Barlow" 
                                            className="w-full px-3 py-2 border rounded-lg text-sm bg-gray-50 font-semibold" 
                                            required 
                                        />
                                    </div>
                                    <button 
                                        type="submit" 
                                        className="w-full bg-[#1B365D] hover:bg-[#152a4b] text-white py-2.5 rounded-lg font-bold text-xs shadow-md transition"
                                    >
                                        Save Profile & Enter Portal
                                    </button>

                                    </select>
                                    <input 
                                        type="text" 
                                        value={pingMessage}

                                        Send Ping
                                    </button>
                                </form>

                                        <button onClick={() => setScheduleView('week')} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${scheduleView === 'week' ? 'bg-[#1B365D] text-white' : 'bg-gray-100 text-gray-600'}`}>Week</button>

                                    </div>

                                        <div className="flex items-center space-x-2 bg-gray-50 px-2 py-1 rounded-lg border">

                                            <span className="text-[11px] font-bold text-[#1B365D] px-1">{currentDate.toDateString()}</span>
                                            <button onClick={() => handleNavigateTime(1)} className="w-6 h-6 flex items-center justify-center bg-white border rounded text-xs font-bold text-[#1B365D]">&rarr;</button>
                                        </div>
                                    )}

                                    <label className="flex items-center space-x-2 text-xs font-semibold cursor-pointer">
                                        <input type="checkbox" checked={filterMyJobsOnly} onChange={(e) => setFilterMyJobsOnly(e.target.checked)} className="rounded text-[#1B365D]" />
                                        <span>My Jobs Only</span>
                                    </label>
                                </div>

                                {scheduleView === 'week' && (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-7 gap-3">

                                            d.setDate(d.getDate() - d.getDay() + idx + 1);
                                            const dateStr = d.toISOString().split('T')[0];
                                            const dayJobs = displayedJobs.filter(j => j.date === dateStr);

                                            return (
                                                <div 
                                                    key={dateStr}
                                                    onDragOver={handleDragOver}
                                                    onDrop={(e) => handleDropOnDate(e, dateStr)}
                                                    className="bg-white rounded-xl p-3 border border-gray-200 min-h-[400px] flex flex-col"
                                                >
                                                    <div className="text-center pb-2 border-b mb-2">
                                                        <span className="text-[10px] font-bold text-gray-400 uppercase">{d.toLocaleDateString('en-US', { weekday: 'short' })}</span>
                                                        <span className="text-xs font-bold text-[#1B365D] block">{dateStr}</span>
                                                    </div>
                                                    <div className="space-y-2 flex-1">
                                                        {dayJobs.map(job => (
                                                            <div 
                                                                key={job.id}
                                                                draggable
                                                                onDragStart={(e) => handleDragStart(e, job.id)}
                                                                onClick={() => setSelectedJob(job)}
                                                                className={`border p-2.5 rounded-xl cursor-pointer transition shadow-xs relative ${getTechColorStyle(job.primaryTech)}`}
                                                            >
                                                                {!job.primaryTech && <div className="text-[9px] bg-amber-500 text-white font-bold px-1 rounded mb-1 inline-block">⚠️ Unassigned</div>}
                                                                {hasUnsignedSwms(job) && <span className="absolute top-2 right-2 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full animate-pulse">⚠️ SWMS</span>}
                                                                <span className="text-[10px] font-bold uppercase block text-gray-500">{job.id}</span>
                                                                <h5 className="font-bold text-xs truncate mt-0.5 text-[#1B365D]">{job.client}</h5>
                                                                <p className="text-[10px] opacity-80 truncate">📍 {job.address}</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                {scheduleView === 'kanban' && (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {['Morning Dispatch', 'Afternoon Dispatch', 'Completed'].map(col => (
                                            <div 
                                                key={col}
                                                onDragOver={handleDragOver}
                                                onDrop={(e) => handleDropOnColumn(e, col)}
                                                className="bg-white rounded-xl p-4 border border-gray-200 min-h-[500px] flex flex-col"
                                            >
                                                <h4 className="font-bold text-xs uppercase text-[#1B365D] pb-3 border-b mb-3">{col}</h4>
                                                <div className="space-y-3 flex-1">
                                                    {displayedJobs.filter(j => (j.column || 'Morning Dispatch') === col).map(job => (
                                                        <div 
                                                            key={job.id}
                                                            draggable
                                                            onDragStart={(e) => handleDragStart(e, job.id)}

                                                            <h5 className="font-bold text-xs mt-1 text-[#1B365D]">{job.client}</h5>

                                                        </div>

                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                            <div key={part.id} className="flex justify-between items-center p-3 bg-gray-50 border rounded-xl text-xs">
                                                <div>
                                                    <span className="font-bold text-[#1B365D] text-sm block">{part.name}</span>
                                                    <span className="text-[10px] bg-blue-100 text-blue-800 px-1 rounded font-mono mr-2">{part.sku}</span>

                                            </div>
                                        ))}
                                    </div>
                                    <div className="bg-gray-50 p-4 rounded-xl border space-y-3">

                                        <form onSubmit={handleSaveMasterPart} className="space-y-3">
                                            <input type="text" value={newPartName} onChange={(e) => setNewPartName(e.target.value)} placeholder="Part Name" className="w-full px-3 py-2 border rounded text-xs bg-white" required />
                                            <input type="text" value={newPartSku} onChange={(e) => setNewPartSku(e.target.value)} placeholder="SKU / Code" className="w-full px-3 py-2 border rounded text-xs bg-white font-mono" />
                                            <select value={newPartCategory} onChange={(e) => setNewPartCategory(e.target.value)} className="w-full px-3 py-2 border rounded text-xs bg-white">
                                                <option value="Cabling">Cabling</option>
                                                <option value="Inverters">Inverters</option>
                                                <option value="Batteries">Batteries</option>
                                                <option value="Switchgear">Switchgear</option>
                                                <option value="Connectors">Connectors</option>
                                            </select>
                                            <button type="submit" className="w-full bg-[#1B365D] text-white py-2 rounded font-bold text-xs">Save Part</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'swms' && isAdmin && (
                            <div className="bg-white p-6 rounded-xl border shadow-sm space-y-6">
                                <h3 className="text-sm font-bold uppercase text-[#1B365D]">🛡️ Master SWMS Template Library</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {swmsTemplates.map((swms, i) => (
                                        <div key={i} className="p-4 bg-gray-50 border rounded-xl space-y-2">
                                            <h5 className="font-bold text-sm text-[#1B365D]">{swms.title}</h5>
                                            <p className="text-xs text-gray-600"><strong>Key Hazards:</strong> {swms.hazards.join(', ')}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'team' && isAdmin && (
                            <div className="bg-white p-6 rounded-xl border shadow-sm space-y-6">
                                <h3 className="text-sm font-bold uppercase text-[#1B365D]">👥 Team Roster & Invitations</h3>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">

                                        <form onSubmit={handleSendInvite} className="space-y-3">
                                            <input type="text" value={inviteName} onChange={(e) => setInviteName(e.target.value)} placeholder="Technician Name" className="w-full px-3 py-2 border rounded text-xs bg-white" required />
                                            <input type="email" value={inviteEmail} onChange={(e) => setInviteEmail(e.target.value)} placeholder="Email Address" className="w-full px-3 py-2 border rounded text-xs bg-white" required />
                                            <select value={inviteRole} onChange={(e) => setInviteRole(e.target.value)} className="w-full px-3 py-2 border rounded text-xs bg-white font-semibold">
                                                <option value="Field Tech">Field Tech</option>
                                                <option value="Admin">Admin</option>
                                            </select>
                                            <button type="submit" disabled={isInviting} className="w-full bg-[#1B365D] text-white py-2 rounded font-bold text-xs">

                                            </button>
                                        </form>
                                    </div>
                                    <div className="space-y-3">
                                        <h4 className="text-xs font-bold text-gray-500 uppercase">Registered Team ({teamMembers.length})</h4>
                                        {teamMembers.map((m) => (
                                            <div key={m.id} className={`flex justify-between items-center p-3 border rounded-xl text-xs ${m.color || 'bg-gray-50'}`}>
                                                <div>
                                                    <strong className="text-sm block">{m.name || 'Unnamed Tech'}</strong>
                                                    <span className="opacity-75 font-mono text-[10px]">{m.email}</span>
                                                </div>
                                                <div className="flex items-center space-x-2">
                                                    <span className={`px-2 py-0.5 rounded font-bold text-[10px] ${m.access === 'Admin' ? 'bg-amber-100 text-amber-900 border' : 'bg-white/70'}`}>
                                                        {m.access || 'Field Tech'}
                                                    </span>
                                                    <button onClick={() => handleToggleUserRole(m.id, m.access)} className="text-indigo-600 font-bold px-2 py-1 bg-white border rounded">
                                                        {m.access === 'Admin' ? 'Downgrade' : '⚡ Upgrade'}
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* JOB DETAILS MODAL */}
                    {selectedJob && (() => {
                        const template = swmsTemplates.find(s => s.title === selectedJob.swmsTemplateTitle) || swmsTemplates[1];
                        return (
                            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 overflow-y-auto">
                                <div className="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                                    <div className="flex justify-between items-start border-b pb-3">
                                        <div>
                                            <span className="text-xs font-bold text-[#00AEEF]">{selectedJob.id}</span>
                                            <h3 className="font-bold text-base text-[#1B365D]">{selectedJob.title}</h3>
                                            <p className="text-xs text-gray-700 font-semibold">{selectedJob.client}</p>
                                            <div className="flex items-center space-x-2 mt-1">
                                                <span className="text-xs text-gray-500">📍 {selectedJob.address}</span>
                                                <button onClick={() => openGoogleMaps(selectedJob.address)} className="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[10px]">🧭 Directions</button>
                                            </div>
                                        </div>
                                        <button onClick={() => setSelectedJob(null)} className="text-gray-400 hover:text-gray-600 text-lg font-bold">&times;</button>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 bg-gray-50 p-3 rounded-lg border">
                                        <div>
                                            <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Scheduled Date</label>
                                            <input type="date" value={selectedJob.date} onChange={(e) => handleUpdateJobInModal({...selectedJob, date: e.target.value})} className="w-full px-2 py-1.5 border rounded text-xs bg-white font-semibold" />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Primary Tech</label>
                                            <select value={selectedJob.primaryTech || ''} onChange={(e) => handleUpdateJobInModal({...selectedJob, primaryTech: e.target.value})} className="w-full px-2 py-1.5 border rounded text-xs bg-white font-semibold">
                                                <option value="">-- Unassigned --</option>
                                                {teamMembers.map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Assigned Crew</label>
                                            <div className="bg-white p-1.5 border rounded text-xs max-h-24 overflow-y-auto space-y-1">
                                                {teamMembers.map(m => {
                                                    const isChecked = selectedJob.assignedTechs?.includes(m.name);
                                                    return (
                                                        <label key={m.id} className="flex items-center space-x-2 text-[11px] cursor-pointer">
                                                            <input type="checkbox" checked={isChecked} onChange={(e) => {
                                                                let updatedTechs = [...(selectedJob.assignedTechs || [])];
                                                                let updatedSigs = { ...(selectedJob.swmsSignatures || {}) };
                                                                if (e.target.checked) {
                                                                    if (!updatedTechs.includes(m.name)) updatedTechs.push(m.name);
                                                                    if (!updatedSigs[m.name]) updatedSigs[m.name] = { signed: false, timestamp: '' };
                                                                } else {
                                                                    updatedTechs = updatedTechs.filter(t => t !== m.name);
                                                                    delete updatedSigs[m.name];
                                                                }
                                                                handleUpdateJobInModal({...selectedJob, assignedTechs: updatedTechs, swmsSignatures: updatedSigs});
                                                            }} />
                                                            <span>{m.name}</span>
                                                        </label>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>

                                    {/* ON-SITE TIME TRACKING */}
                                    <div className="space-y-2 bg-gray-50 p-4 rounded-xl border">
                                        <h4 className="font-bold text-xs uppercase text-[#1B365D]">⏱️ On-Site Time Tracking</h4>
                                        <div className="grid grid-cols-2 gap-3">
                                            <button onClick={() => {
                                                const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                                                handleUpdateJobInModal({...selectedJob, status: 'On Site', timeLogs: { ...selectedJob.timeLogs, startTime: now }});
                                            }} className={`p-3 rounded-xl border text-center transition flex flex-col items-center justify-center ${selectedJob.timeLogs?.startTime ? 'bg-emerald-50 border-emerald-300' : 'bg-emerald-600 hover:bg-emerald-700 text-white shadow-md'}`}>
                                                <span className={`text-[11px] font-extrabold uppercase ${selectedJob.timeLogs?.startTime ? 'text-emerald-800' : 'text-white'}`}>▶ Start Job</span>
                                                <span className={`text-xs font-bold mt-0.5 ${selectedJob.timeLogs?.startTime ? 'text-emerald-900' : 'text-emerald-100'}`}>{selectedJob.timeLogs?.startTime ? `Started: ${selectedJob.timeLogs.startTime}` : 'Click to Start'}</span>
                                            </button>
                                            <button onClick={() => {
                                                const now = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                                                handleUpdateJobInModal({...selectedJob, status: 'Completed', column: 'Completed', timeLogs: { ...selectedJob.timeLogs, completeTime: now }});
                                            }} className={`p-3 rounded-xl border text-center transition flex flex-col items-center justify-center ${selectedJob.timeLogs?.completeTime ? 'bg-red-50 border-red-300' : 'bg-rose-600 hover:bg-rose-700 text-white shadow-md'}`}>
                                                <span className={`text-[11px] font-extrabold uppercase ${selectedJob.timeLogs?.completeTime ? 'text-red-800' : 'text-white'}`}>✓ Complete Job</span>
                                                <span className={`text-xs font-bold mt-0.5 ${selectedJob.timeLogs?.completeTime ? 'text-red-900' : 'text-rose-100'}`}>{selectedJob.timeLogs?.completeTime ? `Finished: ${selectedJob.timeLogs.completeTime}` : 'Click to Complete'}</span>
                                            </button>
                                        </div>
                                    </div>

                                    {/* DOCUMENTS VAULT */}
                                    <div className="space-y-3 bg-indigo-50/50 border border-indigo-200 p-4 rounded-xl">
                                        <h4 className="font-bold text-xs uppercase text-[#1B365D]">📂 Client & Job Documents Vault</h4>
                                        <div className="space-y-1.5 max-h-36 overflow-y-auto">
                                            {(selectedJob.documents || []).map((doc) => (
                                                <div key={doc.id} className="flex justify-between items-center bg-white p-2.5 rounded-lg border text-xs shadow-2xs">
                                                    <div className="flex items-center space-x-2 truncate">
                                                        <span>📄</span>
                                                        <span className="font-bold text-gray-800 truncate">{doc.name}</span>
                                                    </div>
                                                    <button onClick={() => handleDeleteDocument(doc.id)} className="text-red-500 font-extrabold text-sm">&times;</button>
                                                </div>
                                            ))}
                                        </div>
                                        <label className="border-2 border-dashed border-indigo-300 hover:border-[#00AEEF] rounded-lg p-3 flex flex-col items-center justify-center cursor-pointer bg-white transition text-center">
                                            <span className="text-xl">📁</span>
                                            <span className="text-xs font-bold text-[#1B365D] mt-1">Upload Client Briefs, Permits, or Specs</span>
                                            <input type="file" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.txt" onChange={handleFileUpload} className="hidden" />
                                        </label>
                                    </div>

                                    {/* MATERIALS USED */}
                                    <div className="space-y-3 bg-blue-50/60 border border-blue-200 p-4 rounded-xl">
                                        <h4 className="font-bold text-xs uppercase text-[#1B365D]">📦 Materials Used & Inventory Log</h4>
                                        <div className="space-y-1.5 max-h-36 overflow-y-auto">
                                            {(selectedJob.materialsUsed || []).map((mat) => (
                                                <div key={mat.id} className="flex justify-between items-center bg-white p-2 rounded-lg border text-xs">
                                                    <span className="font-semibold text-gray-800">{mat.item}</span>
                                                    <div className="flex items-center space-x-3">
                                                        <span className="font-bold bg-blue-100 text-blue-800 px-2 py-0.5 rounded">Qty: {mat.qty}</span>
                                                        <button onClick={() => handleDeleteMaterialFromJob(mat.id)} className="text-red-500 font-extrabold">&times;</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <div className="flex gap-2">
                                            <select value={newMaterialItem} onChange={(e) => setNewMaterialItem(e.target.value)} className="flex-1 px-2 py-1.5 border rounded text-xs bg-white">
                                                {masterPartsCatalog.map((part) => <option key={part.id} value={part.name}>{part.name} ({part.sku})</option>)}
                                            </select>
                                            <input type="number" min="1" value={newMaterialQty} onChange={(e) => setNewMaterialQty(e.target.value)} className="w-16 px-2 py-1.5 border rounded text-xs text-center font-bold" />
                                            <button onClick={handleAddMaterialToJob} className="bg-[#1B365D] text-white px-3 py-1.5 rounded text-xs font-bold">+ Add</button>
                                        </div>
                                    </div>

                                    {/* SWMS SIGN-OFF */}
                                    <div className="border border-amber-200 bg-amber-50/50 p-4 rounded-xl space-y-3">
                                        <div className="flex justify-between items-center">
                                            <h4 className="font-bold text-xs uppercase text-amber-900">🛡️ SWMS Compliance</h4>
                                            <select value={selectedJob.swmsTemplateTitle || 'Replacement Inverter'} onChange={(e) => handleUpdateJobInModal({...selectedJob, swmsTemplateTitle: e.target.value})} className="px-2 py-1 border rounded text-xs bg-white font-bold">
                                                {swmsTemplates.map(s => <option key={s.title} value={s.title}>{s.title}</option>)}
                                            </select>
                                        </div>
                                        <div className="text-xs bg-white p-3 rounded-lg border space-y-1">
                                            <p className="font-bold text-[#1B365D]">Hazards:</p>
                                            <ul className="list-disc pl-4">{template.hazards.map((h, i) => <li key={i}>{h}</li>)}</ul>
                                        </div>
                                    </div>

                                    {/* PHOTO LOCKER */}
                                    <div className="space-y-3 bg-gray-50 p-4 rounded-xl border">
                                        <h4 className="font-bold text-xs uppercase text-[#1B365D]">📷 On-Site Photo Locker</h4>
                                        <div className="grid grid-cols-3 gap-2">
                                            {(selectedJob.photos || []).map((photoUrl, idx) => (
                                                <div key={idx} className="relative aspect-square bg-gray-200 rounded-lg overflow-hidden border">
                                                    <img src={photoUrl} alt="Site capture" className="w-full h-full object-cover" />
                                                </div>
                                            ))}
                                            <label className="border-2 border-dashed border-gray-300 hover:border-[#00AEEF] rounded-lg aspect-square flex flex-col items-center justify-center cursor-pointer bg-white transition p-1 text-center">
                                                <span className="text-lg">📸</span>
                                                <span className="text-[10px] font-bold text-[#1B365D] mt-1">Take Photo</span>
                                                <input type="file" accept="image/*" capture="environment" onChange={handlePhotoUpload} className="hidden" />
                                            </label>
                                        </div>
                                    </div>

                                    <div className="flex justify-end pt-2">
                                        <button onClick={() => setSelectedJob(null)} className="bg-[#1B365D] text-white px-5 py-2 rounded-lg text-xs font-bold shadow">Save & Close</button>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}

                    {/* CREATE JOB MODAL */}
                    {showCreateModal && (
                        <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-xl shadow-2xl max-w-lg w-full p-6 space-y-4">
                                <h3 className="font-bold text-sm uppercase text-[#1B365D]">Create & Dispatch Job</h3>
                                <form onSubmit={handleCreateJob} className="space-y-3">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Client Name</label>
                                        <div className="relative">
                                            <input type="text" value={newJobClient} onChange={(e) => handleClientInput(e.target.value)} placeholder="Type customer name..." className="w-full px-3 py-2 border rounded-lg text-xs bg-white font-medium" required />
                                            {clientSuggestions.length > 0 && !isClientSelected && (
                                                <div className="absolute z-20 left-0 right-0 mt-1 bg-white border rounded-lg shadow-lg max-h-40 overflow-y-auto">
                                                    {clientSuggestions.map((c, i) => (
                                                        <div key={i} onClick={() => selectExistingClient(c)} className="px-3 py-2 text-xs hover:bg-blue-50 cursor-pointer border-b">
                                                            <strong>{c.name}</strong> <span className="text-gray-400 block text-[10px]">{c.address}</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Job Scope / Title</label>
                                        <input type="text" value={newJobTitle} onChange={(e) => setNewJobTitle(e.target.value)} placeholder="e.g. Inverter Replacement" className="w-full px-3 py-2 border rounded-lg text-xs" required />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Site Address</label>
                                        <input type="text" value={newJobAddress} onChange={(e) => setNewJobAddress(e.target.value)} placeholder="Full address" className="w-full px-3 py-2 border rounded-lg text-xs" required />
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">Primary Tech</label>
                                            <select value={newJobPrimaryTech} onChange={(e) => setNewJobPrimaryTech(e.target.value)} className="w-full px-2 py-1.5 border rounded-lg text-xs">
                                                <option value="">-- Unassigned --</option>
                                                {teamMembers.map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-xs font-bold text-gray-700 mb-1">SWMS Template</label>
                                            <select value={newJobSwmsTemplate} onChange={(e) => setNewJobSwmsTemplate(e.target.value)} className="w-full px-2 py-1.5 border rounded-lg text-xs">
                                                {swmsTemplates.map(s => <option key={s.title} value={s.title}>{s.title}</option>)}
                                            </select>
                                        </div>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 mb-1">Date</label>
                                        <input type="date" value={newJobDate} onChange={(e) => setNewJobDate(e.target.value)} className="w-full px-3 py-2 border rounded-lg text-xs" required />
                                    </div>
                                    <div className="flex justify-end space-x-2 pt-2">
                                        <button type="button" onClick={() => setShowCreateModal(false)} className="px-3 py-1.5 border rounded-lg text-xs">Cancel</button>
                                        <button type="submit" className="bg-[#1B365D] text-white px-4 py-1.5 rounded-lg text-xs font-bold">Save Job</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
