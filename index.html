<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Megawatt Power - Field Operations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- FIREBASE SDK SCRIPTS -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const firebaseConfig = {
            apiKey: "AIzaSyB8rWkwquB6taF4Pjss3Jwa5viJ1KCoPHo",
            authDomain: "megawatt-a68a8.firebaseapp.com",
            projectId: "megawatt-a68a8",
            storageBucket: "megawatt-a68a8.firebasestorage.app",
            messagingSenderId: "619892735313",
            appId: "1:619892735313:web:2063e4fee26f181da06770",
            measurementId: "G-0S2H504BQK"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
            firebase.analytics?.();
        }
        const db = firebase.firestore();

        function App() {
            const [isLoggedIn, setIsLoggedIn] = React.useState(false);
            const [username, setUsername] = React.useState('Marcus Barlow');
            const [pin, setPin] = React.useState('1234');
            const [activeTab, setActiveTab] = React.useState('schedule');
            
            const [scheduleView, setScheduleView] = React.useState('week');
            const [currentDate, setCurrentDate] = React.useState(new Date());
            const [filterMyJobsOnly, setFilterMyJobsOnly] = React.useState(false);
            const [globalSearchQuery, setGlobalSearchQuery] = React.useState('');

            const [notifications, setNotifications] = React.useState([]);
            const [pingMessage, setPingMessage] = React.useState('');
            const [pingTargetTech, setPingTargetTech] = React.useState('Taylor Meyrick');

            const [teamMembers, setTeamMembers] = React.useState([
                { name: 'Marcus Barlow', role: 'Electrician', access: 'Admin', color: 'bg-blue-50 border-blue-300 text-blue-900' },
                { name: 'Taylor Meyrick', role: 'Electrician', access: 'Field Tech', color: 'bg-amber-50 border-amber-300 text-amber-900' },
                { name: 'Nic Borrot', role: 'Electrician', access: 'Field Tech', color: 'bg-emerald-50 border-emerald-300 text-emerald-900' },
                { name: 'Dave Smith', role: 'Electrician', access: 'Field Tech', color: 'bg-purple-50 border-purple-300 text-purple-900' }
            ]);

            const [swmsTemplates, setSwmsTemplates] = React.useState([
                {
                    title: 'Solar Panel Installation',
                    hazards: ['Working at Heights (Roof Fall Risks)', 'Electrical Shock from PV DC Array', 'Manual Handling & Solar Panel Weight'],
                    steps: ['Inspect roof anchor points and harness gear', 'Erect edge protection scaffolding', 'Isolate DC strings before connection']
                },
                {
                    title: 'Replacement Inverter',
                    hazards: ['High Voltage DC/AC Arc Flash', 'Heavy Lifting (Inverter Chassis)', 'Working in Confined Plant Rooms'],
                    steps: ['Perform Lockout/Tagout (LOTO) on AC isolators', 'Verify zero voltage on DC terminals', 'Decommission old unit and mount replacement']
                },
                {
                    title: 'Battery Install',
                    hazards: ['Lithium-ion Battery Fire/Thermal Runaway', 'DC Short Circuit Hazards', 'Heavy Cabinet Placement'],
                    steps: ['Check ventilation clearance and fire rating', 'Mount battery enclosure securely', 'Connect DC breaker and BMS communication cables']
                },
                {
                    title: 'Service Job',
                    hazards: ['General Electrical Shock', 'Switchboard Vermin/Asbestos check', 'Ladders & Trip Hazards'],
                    steps: ['Perform visual inspection of switchboard internals', 'Thermal imaging scan for hot joints', 'Test RCD trip times']
                }
            ]);

            const [editingIndex, setEditingIndex] = React.useState(null);
            const [newStaffName, setNewStaffName] = React.useState('');
            const [newStaffRole, setNewStaffRole] = React.useState('Electrician');
            const [newStaffAccess, setNewStaffAccess] = React.useState('Field Tech');

            const [masterPartsCatalog, setMasterPartsCatalog] = React.useState([
                { id: 1, sku: 'MC4-PAIR', name: 'MC4 Connectors (Pair)', category: 'Connectors', unit: 'Pair' },
                { id: 2, sku: 'DC-CAB-6', name: '6mm² Solar DC Cable (Meters)', category: 'Cabling', unit: 'Meters' },
                { id: 3, sku: 'EARTH-10', name: '10mm² Earth Wire (Meters)', category: 'Cabling', unit: 'Meters' },
                { id: 4, sku: 'INV-3PH-5', name: '3-Phase 5kW Hybrid Inverter', category: 'Inverters', unit: 'Unit' },
                { id: 5, sku: 'PW3-EXP', name: 'Tesla Powerwall 3 Expansion Unit', category: 'Batteries', unit: 'Unit' },
                { id: 6, sku: 'ISO-32A', name: '32A AC Isolator Switch', category: 'Switchgear', unit: 'Unit' }
            ]);
            const [partsSearchQuery, setPartsSearchQuery] = React.useState('');
            const [newPartName, setNewPartName] = React.useState('');
            const [newPartSku, setNewPartSku] = React.useState('');
            const [newPartCategory, setNewPartCategory] = React.useState('Cabling');
            const [newPartUnit, setNewPartUnit] = React.useState('Unit');
            const [editingPartId, setEditingPartId] = React.useState(null);

            const [jobs, setJobs] = React.useState([]);
            const [clients, setClients] = React.useState([]);

            const [selectedJob, setSelectedJob] = React.useState(null);
            const [showCreateModal, setShowCreateModal] = React.useState(false);
            const [newJobTitle, setNewJobTitle] = React.useState('');
            const [newJobClient, setNewJobClient] = React.useState('');
            const [newJobAddress, setNewJobAddress] = React.useState('');
            
            const [clientSuggestions, setClientSuggestions] = React.useState([]);
            const [isClientSelected, setIsClientSelected] = React.useState(false);

            const [newJobPrimaryTech, setNewJobPrimaryTech] = React.useState('Marcus Barlow');
            const [newJobAssignedTechs, setNewJobAssignedTechs] = React.useState(['Marcus Barlow']);
            const [newJobSwmsTemplate, setNewJobSwmsTemplate] = React.useState('Replacement Inverter');
            const [newJobDate, setNewJobDate] = React.useState(new Date().toISOString().split('T')[0]);
            const [draggedJobId, setDraggedJobId] = React.useState(null);

            const [newMaterialItem, setNewMaterialItem] = React.useState(masterPartsCatalog[0]?.name || '');
            const [newMaterialQty, setNewMaterialQty] = React.useState(1);

            React.useEffect(() => {
                const unsubJobs = db.collection('jobs').onSnapshot(snapshot => {
                    const loadedJobs = snapshot.docs.map(doc => ({ ...doc.data(), docId: doc.id }));
                    setJobs(loadedJobs);
                });

                const unsubClients = db.collection('clients').onSnapshot(snapshot => {
                    const loadedClients = snapshot.docs.map(doc => ({ ...doc.data(), docId: doc.id }));
                    setClients(loadedClients);
                });

                return () => {
                    unsubJobs();
                    unsubClients();
                };
            }, []);

            const saveJobToCloud = async (jobObj) => {
                try {
                    await db.collection('jobs').doc(jobObj.id).set(jobObj);
                } catch (err) {
                    console.error("Error saving job:", err);
                    alert("Error saving job to database. Check console logs.");
                }
            };

            const currentUserObj = teamMembers.find(m => m.name === username) || { access: 'Admin' };
            const isAdmin = currentUserObj.access === 'Admin';

            const getTechColorStyle = (techName) => {
                if (!techName) return 'bg-gray-50 border-dashed border-gray-300 text-gray-500';
                const tech = teamMembers.find(m => m.name === techName);
                return tech ? tech.color : 'bg-gray-50 border-gray-200 text-gray-800';
            };

            const hasUnsignedSwms = (job) => {
                if (!job.assignedTechs || job.assignedTechs.length === 0) return false;
                return job.assignedTechs.some(tech => !job.swmsSignatures?.[tech]?.signed);
            };

            const handleLogin = (e) => {
                e.preventDefault();
                if (pin === '1234') {
                    setIsLoggedIn(true);
                    if (!isAdmin && (activeTab === 'team' || activeTab === 'parts')) setActiveTab('schedule');
                } else {
                    alert('Invalid PIN. Use 1234 for demo.');
                }
            };

            const handleClientInput = (val) => {
                setNewJobClient(val);
                setIsClientSelected(false);
                if (val.trim().length > 0) {
                    const matches = clients.filter(c => c.name.toLowerCase().includes(val.toLowerCase()));
                    setClientSuggestions(matches);
                } else {
                    setClientSuggestions([]);
                }
            };

            const selectExistingClient = (c) => {
                setNewJobClient(c.name);
                setNewJobAddress(c.address || '');
                setClientSuggestions([]);
                setIsClientSelected(true);
            };

            const addNewClientToDatabase = async () => {
                if (!newJobClient.trim()) return;
                const clientName = newJobClient.trim();
                const clientAddress = newJobAddress.trim() || 'Coffs Harbour NSW';
                
                try {
                    await db.collection('clients').add({ name: clientName, address: clientAddress });
                    if (!newJobAddress.trim()) {
                        setNewJobAddress(clientAddress);
                    }
                    setIsClientSelected(true);
                    setClientSuggestions([]);
                } catch (err) {
                    console.error("Error adding client:", err);
                }
            };

            const handleCreateJob = async (e) => {
                e.preventDefault();
                const initialSigs = {};
                newJobAssignedTechs.forEach(t => {
                    initialSigs[t] = { signed: false, timestamp: '' };
                });

                const jobId = `JOB-${Math.floor(Math.random()*900+100)}`;
                const clientName = newJobClient || 'General Client';
                const clientAddress = newJobAddress || 'Coffs Harbour NSW';

                const newJob = {
                    id: jobId,
                    title: newJobTitle || 'Electrical Service',
                    client: clientName,
                    address: clientAddress,
                    primaryTech: newJobPrimaryTech,
                    assignedTechs: newJobAssignedTechs,
                    date: newJobDate,
                    time: '09:00 AM',
                    status: newJobPrimaryTech ? 'Pending' : 'Unassigned',
                    column: 'Morning Dispatch',
                    swmsTemplateTitle: newJobSwmsTemplate,
                    swmsSignatures: initialSigs,
                    materialsUsed: [],
                    documents: [],
                    timeLogs: { startTime: '', completeTime: '' },
                    notesLog: [],
                    photos: [],
                    newNoteText: ''
                };

                try {
                    if (!clients.some(c => c.name.toLowerCase() === clientName.toLowerCase())) {
                        await db.collection('clients').add({ name: clientName, address: clientAddress });
                    }

                    await saveJobToCloud(newJob);
                    
                    setShowCreateModal(false);
                    setNewJobTitle('');
                    setNewJobClient('');
                    setNewJobAddress('');
                    setClientSuggestions([]);
                    setIsClientSelected(false);
                } catch (err) {
                    console.error("Failed to create job:", err);
                    alert("Failed to save job. Please check your internet connection.");
                }
            };

            const handleSendPing = (e) => {
                e.preventDefault();
                if (!pingMessage.trim()) return;
                const newAlert = {
                    id: Date.now(),
                    recipient: pingTargetTech,
                    sender: username,
                    message: pingMessage.trim(),
                    timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    read: false
                };
                setNotifications([newAlert, ...notifications]);
                setPingMessage('');
                alert(`Dispatch alert successfully sent to ${pingTargetTech}!`);
            };

            const handleAddMaterialToJob = () => {
                if (!selectedJob || !newMaterialItem) return;
                const existing = selectedJob.materialsUsed || [];
                const newItemObj = { id: Date.now(), item: newMaterialItem, qty: Number(newMaterialQty) || 1 };
                handleUpdateJobInModal({ ...selectedJob, materialsUsed: [...existing, newItemObj] });
            };

            const handleDeleteMaterialFromJob = (matId) => {
                if (!selectedJob) return;
                const updated = (selectedJob.materialsUsed || []).filter(m => m.id !== matId);
                handleUpdateJobInModal({ ...selectedJob, materialsUsed: updated });
            };

            const handleFileUpload = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0 || !selectedJob) return;

                const newDocs = files.map(file => {
                    let fileType = 'doc';
                    const ext = file.name.split('.').pop().toLowerCase();
                    if (ext === 'pdf') fileType = 'pdf';
                    else if (['xls', 'xlsx', 'csv'].includes(ext)) fileType = 'sheet';

                    const sizeKb = (file.size / 1024).toFixed(0);
                    const sizeFormatted = sizeKb > 1024 ? `${(sizeKb / 1024).toFixed(1)} MB` : `${sizeKb} KB`;

                    return {
                        id: Date.now() + Math.random(),
                        name: file.name,
                        size: sizeFormatted,
                        type: fileType,
                        url: URL.createObjectURL(file)
                    };
                });

                const updatedDocs = [...(selectedJob.documents || []), ...newDocs];
                handleUpdateJobInModal({ ...selectedJob, documents: updatedDocs });
            };

            const handleDeleteDocument = (docId) => {
                if (!selectedJob) return;
                const updatedDocs = (selectedJob.documents || []).filter(d => d.id !== docId);
                handleUpdateJobInModal({ ...selectedJob, documents: updatedDocs });
            };

            const handleSaveMasterPart = (e) => {
                e.preventDefault();
                if (!newPartName.trim()) return;

                let updatedCatalog = [...masterPartsCatalog];
                if (editingPartId !== null) {
                    updatedCatalog = updatedCatalog.map(p => p.id === editingPartId ? {
                        ...p,
                        name: newPartName.trim(),
                        sku: newPartSku.trim() || p.sku,
                        category: newPartCategory,
                        unit: newPartUnit
                    } : p);
                    setEditingPartId(null);
                } else {
                    const newPartObj = {
                        id: Date.now(),
                        sku: newPartSku.trim() || `SKU-${Math.floor(Math.random()*9000+1000)}`,
                        name: newPartName.trim(),
                        category: newPartCategory,
                        unit: newPartUnit
                    };
                    updatedCatalog.push(newPartObj);
                }
                setMasterPartsCatalog(updatedCatalog);
                setNewPartName('');
                setNewPartSku('');
            };

            const handleEditMasterPart = (part) => {
                setEditingPartId(part.id);
                setNewPartName(part.name);
                setNewPartSku(part.sku);
                setNewPartCategory(part.category);
                setNewPartUnit(part.unit);
            };

            const handleDeleteMasterPart = (partId) => {
                const updated = masterPartsCatalog.filter(p => p.id !== partId);
                setMasterPartsCatalog(updated);
                if (editingPartId === partId) {
                    setEditingPartId(null);
                    setNewPartName('');
                    setNewPartSku('');
                }
            };

            const handleSaveStaff = (e) => {
                e.preventDefault();
                if (!newStaffName) return;

                if (editingIndex !== null) {
                    const updated = [...teamMembers];
                    updated[editingIndex] = {
                        ...updated[editingIndex],
                        name: newStaffName,
                        role: newStaffRole || 'Electrician',
                        access: newStaffAccess
                    };
                    setTeamMembers(updated);
                    setEditingIndex(null);
                } else {
                    const colorPalette = [
                        'bg-cyan-50 border-cyan-300 text-cyan-900',
                        'bg-rose-50 border-rose-300 text-rose-900',
                        'bg-indigo-50 border-indigo-300 text-indigo-900',
                        'bg-[#00AEEF]/20 border-[#00AEEF] text-[#1B365D]'
                    ];
                    const randomColor = colorPalette[teamMembers.length % colorPalette.length];
                    setTeamMembers([...teamMembers, { name: newStaffName, role: newStaffRole || 'Electrician', access: newStaffAccess, color: randomColor }]);
                }
                setNewStaffName('');
                setNewStaffRole('Electrician');
            };

            const handleEditStaff = (index) => {
                const member = teamMembers[index];
                setEditingIndex(index);
                setNewStaffName(member.name);
                setNewStaffRole(member.role);
                setNewStaffAccess(member.access);
            };

            const handleDeleteStaff = (name) => {
                if (teamMembers.length <= 1) {
                    alert('Cannot delete the last remaining team member.');
                    return;
                }
                setTeamMembers(teamMembers.filter(m => m.name !== name));
                if (editingIndex !== null) {
                    setEditingIndex(null);
                    setNewStaffName('');
                }
            };

            const handleNavigateTime = (direction) => {
                const newDate = new Date(currentDate);
                if (scheduleView === 'day') {
                    newDate.setDate(newDate.getDate() + direction);
                } else if (scheduleView === 'week') {
                    newDate.setDate(newDate.getDate() + (direction * 7));
                } else if (scheduleView === 'month') {
                    newDate.setMonth(newDate.getMonth() + direction);
                }
                setCurrentDate(newDate);
                setNewJobDate(newDate.toISOString().split('T')[0]);
            };

            const handleDragStart = (e, jobId) => {
                setDraggedJobId(jobId);
                e.dataTransfer.setData('text/plain', jobId);
            };

            const handleDropOnDate = async (e, targetDate) => {
                e.preventDefault();
                if (!draggedJobId) return;
                const targetJob = jobs.find(j => j.id === draggedJobId);
                if (targetJob) {
                    const updated = { ...targetJob, date: targetDate };
                    await saveJobToCloud(updated);
                }
                setDraggedJobId(null);
            };

            const handleDropOnColumn = async (e, targetColumn) => {
                e.preventDefault();
                if (!draggedJobId) return;
                const targetJob = jobs.find(j => j.id === draggedJobId);
                if (targetJob) {
                    let newStatus = targetJob.status;
                    if (targetColumn === 'Completed') newStatus = 'Completed';
                    else if (targetColumn.includes('Dispatch')) newStatus = 'On Site';
                    const updated = { ...targetJob, column: targetColumn, status: newStatus };
                    await saveJobToCloud(updated);
                }
                setDraggedJobId(null);
            };

            const handleDragOver = (e) => {
                e.preventDefault();
            };

            const handleUpdateJobInModal = async (updatedJob) => {
                setSelectedJob(updatedJob);
                await saveJobToCloud(updatedJob);
            };

            const handlePhotoUpload = (e) => {
                const files = Array.from(e.target.files);
                if (files.length === 0) return;
                const newPhotoUrls = files.map(file => URL.createObjectURL(file));
                const updatedPhotos = [...(selectedJob.photos || []), ...newPhotoUrls];
                handleUpdateJobInModal({ ...selectedJob, photos: updatedPhotos });
            };

            const displayedJobs = jobs.filter(job => {
                if (filterMyJobsOnly && !job.assignedTechs?.includes(username)) return false;

                if (globalSearchQuery.trim().length > 0) {
                    const q = globalSearchQuery.toLowerCase();
                    const matchesName = job.client?.toLowerCase().includes(q);
                    const matchesId = job.id?.toLowerCase().includes(q);
                    const matchesAddress = job.address?.toLowerCase().includes(q);
                    const matchesTitle = job.title?.toLowerCase().includes(q);
                    return matchesName || matchesId || matchesAddress || matchesTitle;
                }
                return true;
            });

            const filteredCatalog = masterPartsCatalog.filter(p => {
                if (!partsSearchQuery.trim()) return true;
                const q = partsSearchQuery.toLowerCase();
                return p.name.toLowerCase().includes(q) || p.sku.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
            });

            const myAlerts = notifications.filter(n => n.recipient === username && !n.read);

            const openGoogleMaps = (address) => {
                if (!address) return;
                const encodedAddress = encodeURIComponent(address);
                window.open(`https://www.google.com/maps/search/?api=1&query=${encodedAddress}`, '_blank');
            };

            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-[#1B365D] flex items-center justify-center p-4">
                        <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden border-t-4 border-[#00AEEF]">
                            <div className="p-8 text-center bg-gradient-to-b from-[#1B365D]/5 to-transparent">
                                <h1 className="text-2xl font-bold text-[#1B365D]">Megawatt Power</h1>
                                <p className="text-xs font-bold text-[#00AEEF] uppercase mt-1">Solar and Electrical Operations</p>
                            </div>
                            <form onSubmit={handleLogin} className="p-8 pt-0 space-y-4">
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Select User Profile</label>
                                    <select 
                                        value={username} 
                                        onChange={(e) => setUsername(e.target.value)}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm bg-gray-50 font-medium"
                                    >
                                        {teamMembers.map(m => (
                                            <option key={m.name} value={m.name}>{m.name} ({m.access})</option>
                                        ))}
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Security PIN (1234)</label>
                                    <input 
                                        type="password" 
                                        value={pin}
                                        onChange={(e) => setPin(e.target.value)}
                                        className="w-full px-3 py-2 border border-gray-300 rounded-lg text-sm"
                                        required
                                    />
                                </div>
                                <button type="submit" className="w-full bg-[#1B365D] hover:bg-[#152a4b] text-white py-2.5 rounded-lg font-semibold text-sm transition shadow-md">
                                    Launch Portal
                                </button>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col font-sans text-gray-800">
                    <header className="bg-[#1B365D] text-white shadow-md border-b-2 border-[#00AEEF] sticky top-0 z-30">
                        <div className="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
                            
                            <div className="flex items-center justify-between w-full md:w-auto space-x-2">
                                <span className="font-bold text-base md:text-lg tracking-tight">⚡ Megawatt Power</span>
                                {isAdmin && (
                                    <div className="flex space-x-1">
                                        <button 
                                            onClick={() => setActiveTab('team')} 
                                            className={`text-[11px] font-bold px-2 py-1 rounded shadow transition ${activeTab === 'team' ? 'bg-[#00AEEF] text-[#1B365D]' : 'bg-[#284b7c] hover:bg-[#325a94] text-white'}`}
                                        >
                                            👥 Team
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('parts')} 
                                            className={`text-[11px] font-bold px-2 py-1 rounded shadow transition ${activeTab === 'parts' ? 'bg-[#00AEEF] text-[#1B365D]' : 'bg-[#284b7c] hover:bg-[#325a94] text-white'}`}
                                        >
                                            📦 Parts Catalog
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('swms')} 
                                            className={`text-[11px] font-bold px-2 py-1 rounded shadow transition ${activeTab === 'swms' ? 'bg-[#00AEEF] text-[#1B365D]' : 'bg-[#284b7c] hover:bg-[#325a94] text-white'}`}
                                        >
                                            🛡️ SWMS
                                        </button>
                                    </div>
                                )}
                            </div>

                            <div className="flex justify-center w-full md:w-auto">
                                <button 
                                    onClick={() => setActiveTab('schedule')} 
                                    className={`text-xs md:text-sm font-extrabold px-4 py-1.5 rounded-xl shadow-lg transition transform hover:scale-105 ${activeTab === 'schedule' ? 'bg-[#00AEEF] text-[#1B365D] ring-2 ring-white/50' : 'bg-[#2c5282] hover:bg-[#3182ce] text-white'}`}
                                >
                                    📅 Schedule
                                </button>
                            </div>

                            <div className="flex items-center justify-end w-full md:w-auto space-x-2 flex-wrap gap-y-2">
                                <div className="relative flex-1 md:flex-initial">
                                    <span className="absolute inset-y-0 left-0 pl-2.5 flex items-center pointer-events-none text-xs text-gray-400">🔍</span>
                                    <input 
                                        type="text"
                                        value={globalSearchQuery}
                                        onChange={(e) => setGlobalSearchQuery(e.target.value)}
                                        placeholder="Search address, client, ID..."
                                        className="bg-[#244573] text-white placeholder-gray-300 text-xs pl-8 pr-3 py-1.5 rounded-xl border border-[#00AEEF]/40 focus:outline-none focus:ring-2 focus:ring-[#00AEEF] w-full md:w-52 font-medium shadow-inner"
                                    />
                                    {globalSearchQuery && (
                                        <button onClick={() => setGlobalSearchQuery('')} className="absolute inset-y-0 right-0 pr-2 flex items-center text-xs text-gray-300 hover:text-white font-bold">&times;</button>
                                    )}
                                </div>

                                {isAdmin && (
                                    <button 
                                        onClick={() => setShowCreateModal(true)} 
                                        className="bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-xl text-xs font-extrabold shadow-md transition whitespace-nowrap"
                                    >
                                        + New Job
                                    </button>
                                )}

                                <div className="flex items-center space-x-1.5 bg-black/20 px-2.5 py-1 rounded-lg border border-white/10 text-xs">
                                    <span className="font-bold text-[#00AEEF] truncate max-w-[90px]">{username}</span>
                                    <button onClick={() => setIsLoggedIn(false)} className="text-gray-300 hover:text-white font-semibold">
                                        Logout
                                    </button>
                                </div>
                            </div>

                        </div>
                    </header>

                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-4">
                        {myAlerts.length > 0 && (
                            <div className="bg-amber-500 text-white p-3 rounded-xl shadow-md flex items-center justify-between text-xs animate-bounce">
                                <div className="flex items-center space-x-2">
                                    <span className="text-lg">🚨</span>
                                    <div>
                                        <strong>Dispatch Alert from {myAlerts[0].sender}:</strong> {myAlerts[0].message} <span className="opacity-75 text-[10px]">({myAlerts[0].timestamp})</span>
                                    </div>
                                </div>
                                <button 
                                    onClick={() => {
                                        setNotifications(notifications.map(n => n.id === myAlerts[0].id ? {...n, read: true} : n));
                                    }}
                                    className="bg-white text-amber-900 font-bold px-3 py-1 rounded shadow-xs text-[10px]"
                                >
                                    Dismiss Alert
                                </button>
                            </div>
                        )}

                        {isAdmin && (
                            <div className="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex flex-col md:flex-row items-center justify-between gap-3">
                                <div className="flex items-center space-x-2">
                                    <span className="text-lg">💬</span>
                                    <span className="text-xs font-bold text-[#1B365D] uppercase">Office Admin Dispatch Ping</span>
                                </div>
                                <form onSubmit={handleSendPing} className="flex flex-wrap items-center gap-2 w-full md:w-auto">
                                    <select 
                                        value={pingTargetTech} 
                                        onChange={(e) => setPingTargetTech(e.target.value)}
                                        className="px-2.5 py-1.5 border rounded-lg text-xs bg-gray-50 font-semibold"
                                    >
                                        {teamMembers.map(m => <option key={m.name} value={m.name}>{m.name}</option>)}
                                    </select>
                                    <input 
                                        type="text" 
                                        value={pingMessage} 
                                        onChange={(e) => setPingMessage(e.target.value)}
                                        placeholder="Type urgent dispatch instruction..." 
                                        className="flex-1 md:w-72 px-3 py-1.5 border rounded-lg text-xs bg-white"
                                        required
                                    />
                                    <button type="submit" className="bg-[#1B365D] hover:bg-[#152a4b] text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-xs whitespace-nowrap">
                                        Send Ping
                                    </button>
                                </form>
                            </div>
                        )}

                        {globalSearchQuery && (
                            <div className="bg-sky-50 border border-sky-200 p-3 rounded-xl flex justify-between items-center text-xs text-sky-900 shadow-xs">
                                <span>🔍 Showing search results for: <strong>"{globalSearchQuery}"</strong> ({displayedJobs.length} found)</span>
                                <button onClick={() => setGlobalSearchQuery('')} className="bg-sky-200 hover:bg-sky-300 px-2.5 py-1 rounded font-bold text-[10px]">Clear</button>
                            </div>
                        )}

                        {activeTab === 'schedule' && (
                            <div className="space-y-4">
                                <div className="bg-white p-3 rounded-xl shadow-sm border border-gray-200 flex flex-wrap items-center justify-between gap-3">
                                    <div className="flex items-center space-x-1 flex-wrap">
                                        <button onClick={() => setScheduleView('day')} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${scheduleView === 'day' ? 'bg-[#1B365D] text-white' : 'bg-gray-100 text-gray-600'}`}>Day</button>
                                        <button onClick={() => setScheduleView('week')} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${scheduleView === 'week' ? 'bg-[#1B365D] text-white' : 'bg-gray-100 text-gray-600'}`}>Week</button>
                                        <button onClick={() => setScheduleView('month')} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${scheduleView === 'month' ? 'bg-[#1B365D] text-white' : 'bg-gray-100 text-gray-600'}`}>Month</button>
                                        <button onClick={() => setScheduleView('kanban')} className={`px-2.5 py-1 rounded-lg text-xs font-bold ${scheduleView === 'kanban' ? 'bg-[#1B365D] text-white' : 'bg-gray-100 text-gray-600'}`}>Kanban</button>
                                    </div>

                                    {scheduleView !== 'kanban' && (
                                        <div className="flex items-center space-x-2 bg-gray-50 px-2 py-1 rounded-lg border border-gray-200">
                                            <button onClick={() => handleNavigateTime(-1)} className="w-6 h-6 flex items-center justify-center bg-white border rounded hover:bg-gray-100 text-xs font-bold text-[#1B365D]">&larr;</button>
                                            <span className="text-[11px] font-bold text-[#1B365D] px-1">{currentDate.toDateString()}</span>
                                            <button onClick={() => handleNavigateTime(1)} className="w-6 h-6 flex items-center justify-center bg-white border rounded hover:bg-gray-100 text-xs font-bold text-[#1B365D]">&rarr;</button>
                                        </div>
                                    )}

                                    <label className="flex items-center space-x-2 text-xs font-semibold cursor-pointer">
                                        <input type="checkbox" checked={filterMyJobsOnly} onChange={(e) => setFilterMyJobsOnly(e.target.checked)} className="rounded text-[#1B365D]" />
                                        <span>My Jobs Only</span>
                                    </label>
                                </div>

                                {scheduleView === 'day' && (
                                    <div className="bg-white p-4 rounded-xl border border-gray-200 space-y-4 shadow-sm">
                                        <div className="flex justify-between items-center border-b pb-3">
                                            <h3 className="text-xs md:text-sm font-bold text-[#1B365D]">Daily Schedule: {currentDate.toISOString().split('T')[0]}</h3>
                                            <span className="text-[11px] text-gray-500 font-semibold">08:00 AM – 05:00 PM</span>
                                        </div>
                                        <div className="space-y-3">
                                            {['08:00 AM', '09:00 AM', '10:00 AM', '11:00 AM', '12:00 PM', '01:00 PM', '02:00 PM', '03:00 PM', '04:00 PM', '05:00 PM'].map(hour => {
                                                const hourJobs = displayedJobs.filter(j => j.date === currentDate.toISOString().split('T')[0] && (j.time.startsWith(hour.substring(0, 2)) || j.time === hour));
                                                return (
                                                    <div key={hour} className="flex flex-col md:flex-row items-start border-b border-gray-100 pb-3 last:border-b-0 gap-2">
                                                        <span className="w-24 text-xs font-bold text-gray-400 pt-1">{hour}</span>
                                                        <div className="flex-1 grid grid-cols-1 md:grid-cols-2 gap-3 w-full">
                                                            {hourJobs.length > 0 ? (
                                                                hourJobs.map(job => (
                                                                    <div 
                                                                        key={job.id} 
                                                                        onClick={() => setSelectedJob(job)} 
                                                                        className={`p-3 border rounded-xl cursor-pointer shadow-xs transition hover:shadow-md relative ${getTechColorStyle(job.primaryTech)}`}
                                                                    >
                                                                        {!job.primaryTech && (
                                                                            <span className="absolute top-2 right-2 bg-amber-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">
                                                                                ⚠️ Unassigned
                                                                            </span>
                                                                        )}
                                                                        {hasUnsignedSwms(job) && (
                                                                            <span className="absolute top-2 right-2 bg-red-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded-full animate-pulse">
                                                                                ⚠️ SWMS Pending
                                                                            </span>
                                                                        )}
                                                                        <div className="flex justify-between items-center mb-1">
                                                                            <span className="text-[10px] font-extrabold uppercase">{job.id}</span>
                                                                            <span className="text-[10px] font-semibold px-2 py-0.5 bg-white/60 rounded">Primary: {job.primaryTech || 'Unassigned'}</span>
                                                                        </div>
                                                                        <h4 className="font-bold text-sm text-[#1B365D]">{job.client}</h4>
                                                                        <p className="text-xs opacity-90 mt-0.5 font-medium">📍 {job.address}</p>
                                                                        <p className="text-[10px] text-gray-500 mt-1">Crew: {job.assignedTechs?.length > 0 ? job.assignedTechs.join(', ') : 'None assigned'}</p>
                                                                    </div>
                                                                ))
                                                            ) : (
                                                                <div className="py-1 text-xs text-gray-300 italic">No jobs scheduled</div>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}

                                {scheduleView === 'week' && (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-7 gap-3">
                                        {Array.from({ length: 7 }).map((_, idx) => {
                                            const d = new Date(currentDate);
                                            d.setDate(d.getDate() - d.getDay() + idx + 1);
                                            const dateStr = d.toISOString().split('T')[0];
                                            const dayJobs = displayedJobs.filter(j => j.date === dateStr);

                                            return (
                                                <div 
                                                    key={dateStr}
                                                    onDragOver={handleDragOver}
                                                    onDrop={(e) => handleDropOnDate(e, dateStr)}
                                                    className="bg-white rounded-xl p-3 border border-gray-200 min-h-[350px] md:min-h-[450px] flex flex-col"
                                                >
                                                    <div className="text-center pb-2 border-b mb-2">
                                                        <span className="text-[10px] font-bold text-gray-400 uppercase">{d.toLocaleDateString('en-US', { weekday: 'short' })}</span>
                                                        <span className="text-xs font-bold text-[#1B365D] block">{dateStr}</span>
                                                    </div>
                                                    <div className="space-y-2 flex-1">
                                                        {dayJobs.map(job => (
                                                            <div 
                                                                key={job.id}
                                                                draggable
                                                                onDragStart={(e) => handleDragStart(e, job.id)}
                                                                onClick={() => setSelectedJob(job)}
                                                                className={`border p-2.5 rounded-xl cursor-pointer transition shadow-xs relative ${getTechColorStyle(job.primaryTech)}`}
                                                            >
                                                                {!job.primaryTech && (
                                                                    <div className="text-[9px] bg-amber-500 text-white font-bold px-1 rounded mb-1 inline-block">
                                                                        ⚠️ Unassigned
                                                                    </div>
                                                                )}
                                                                <span className="text-[10px] font-bold uppercase block text-gray-500">{job.id}</span>
                                                                <h5 className="font-bold text-xs truncate mt-0.5 text-[#1B365D]">{job.client}</h5>
                                                                <p className="text-[10px] opacity-80 truncate">📍 {job.address}</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                )}

                                {scheduleView === 'month' && (
                                    <div className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm space-y-3 overflow-x-auto">
                                        <div className="text-center font-bold text-sm text-[#1B365D] uppercase tracking-wide">
                                            {currentDate.toLocaleString('default', { month: 'long', year: 'numeric' })}
                                        </div>
                                        <div className="grid grid-cols-7 gap-2 min-w-[600px]">
                                            {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => (
                                                <div key={d} className="text-center text-[10px] font-bold text-gray-400 uppercase">{d}</div>
                                            ))}
                                            {(() => {
                                                const year = currentDate.getFullYear();
                                                const month = currentDate.getMonth();
                                                const firstDayIndex = new Date(year, month, 1).getDay();
                                                const totalDays = new Date(year, month + 1, 0).getDate();
                                                const daysArray = [];

                                                for (let i = 0; i < firstDayIndex; i++) {
                                                    daysArray.push(<div key={`empty-${i}`} className="p-2 bg-gray-50/50 rounded-lg min-h-[90px]"></div>);
                                                }

                                                for (let dayNum = 1; dayNum <= totalDays; dayNum++) {
                                                    const formattedMonth = String(month + 1).padStart(2, '0');
                                                    const formattedDay = String(dayNum).padStart(2, '0');
                                                    const dateStr = `${year}-${formattedMonth}-${formattedDay}`;
                                                    const dayJobs = displayedJobs.filter(j => j.date === dateStr);

                                                    daysArray.push(
                                                        <div 
                                                            key={dateStr}
                                                            onDragOver={handleDragOver}
                                                            onDrop={(e) => handleDropOnDate(e, dateStr)}
                                                            className="bg-white p-2 rounded-lg border border-gray-200 min-h-[100px] flex flex-col"
                                                        >
                                                            <span className="text-xs font-bold text-[#1B365D] mb-1">{dayNum}</span>
                                                            <div className="space-y-1 flex-1 overflow-y-auto">
                                                                {dayJobs.map(job => (
                                                                    <div 
                                                                        key={job.id}
                                                                        draggable
                                                                        onDragStart={(e) => handleDragStart(e, job.id)}
                                                                        onClick={() => setSelectedJob(job)}
                                                                        className={`border p-1 rounded cursor-pointer text-[10px] ${getTechColorStyle(job.primaryTech)}`}
                                                                    >
                                                                        <span className="font-bold block truncate">{job.client}</span>
                                                                        <span className="text-[9px] opacity-75 truncate block">📍 {job.address}</span>
                                                                    </div>
                                                                ))}
                                                            </div>
                                                        </div>
                                                    );
                                                }
                                                return daysArray;
                                            })()}
                                        </div>
                                    </div>
                                )}

                                {scheduleView === 'kanban' && (
                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                        {['Morning Dispatch', 'Afternoon Dispatch', 'Completed'].map(col => (
                                            <div 
                                                key={col}
                                                onDragOver={handleDragOver}
                                                onDrop={(e) => handleDropOnColumn(e, col)}
                                                className="bg-white rounded-xl p-4 border border-gray-200 min-h-[400px] md:min-h-[500px] flex flex-col"
                                            >
                                                <h4 className="font-bold text-xs uppercase text-[#1B365D] pb-3 border-b mb-3">{col}</h4>
                                                <div className="space-y-3 flex-1">
                                                    {displayedJobs.filter(j => (j.column || 'Morning Dispatch') === col).map(job => (
                                                        <div 
                                                            key={job.id}
                                                            draggable
                                                            onDragStart={(e) => handleDragStart(e, job.id)}
                                                            onClick={() => setSelectedJob(job)}
                                                            className={`border p-3 rounded-xl cursor-pointer transition shadow-xs relative ${getTechColorStyle(job.primaryTech)}`}
                                                        >
                                                            {!job.primaryTech && (
                                                                <span className="absolute top-2 right-2 bg-amber-500 text-white text-[9px] font-bold px-1.5 py-0.5 rounded">
                                                                    ⚠️ Unassigned
                                                                </span>
                                                            )}
                                                            <span className="text-[10px] font-bold uppercase text-gray-500">{job.id}</span>
                                                            <h5 className="font-bold text-xs mt-1 text-[#1B365D]">{job.client}</h5>
                                                            <p className="text-[10px] opacity-80 mt-0.5">📍 {job.address}</p>
                                                            <div className="mt-2 pt-2 border-t border-current/10 flex justify-between items-center text-[10px]">
                                                                <span>Crew: <strong>{job.assignedTechs?.length || 0} techs</strong></span>
                                                                <span className="font-bold">{job.date}</span>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'parts' && isAdmin && (
                            <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-6">
                                <div className="flex flex-col md:flex-row justify-between items-start md:items-center border-b pb-3 gap-3">
                                    <div>
                                        <h3 className="text-sm font-bold uppercase text-[#1B365D]">📦 Master Parts & Inventory Catalog</h3>
                                        <p className="text-xs text-gray-500">Manage standard items available for selection in field job logs.</p>
                                    </div>
                                    <div className="w-full md:w-72">
                                        <input 
                                            type="text" 
                                            value={partsSearchQuery}
                                            onChange={(e) => setPartsSearchQuery(e.target.value)}
                                            placeholder="Search parts by name, SKU, category..."
                                            className="w-full px-3 py-1.5 border rounded-lg text-xs bg-gray-50 font-medium"
                                        />
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="md:col-span-2 space-y-2 max-h-[450px] overflow-y-auto">
                                        <div className="text-xs font-bold text-gray-400 uppercase mb-2">Catalog Items ({filteredCatalog.length})</div>
                                        {filteredCatalog.map(part => (
                                            <div key={part.id} className="flex justify-between items-center p-3 bg-gray-50 border rounded-xl text-xs">
                                                <div>
                                                    <span className="font-bold text-[#1B365D] text-sm block">{part.name}</span>
                                                    <span className="text-[10px] bg-blue-100 text-blue-800 px-1.5 py-0.5 rounded font-mono mr-2">{part.sku}</span>
                                                    <span className="text-gray-500 font-semibold">Category: {part.category}</span>
                                                    <span className="text-gray-400 ml-2">({part.unit})</span>
                                                </div>
                                                <div className="flex items-center space-x-2">
                                                    <button onClick={() => handleEditMasterPart(part)} className="text-blue-600 hover:text-blue-800 font-bold px-2 py-1 bg-white border rounded">Edit</button>
                                                    <button onClick={() => handleDeleteMasterPart(part.id)} className="text-red-500 hover:text-red-700 font-bold px-2 py-1 bg-white border rounded">&times;</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>

                                    <div className="bg-gray-50 p-4 rounded-xl border space-y-3">
                                        <h4 className="text-xs font-bold text-[#1B365D] uppercase">
                                            {editingPartId !== null ? 'Edit Master Part' : 'Add New Part to Catalog'}
                                        </h4>
                                        <form onSubmit={handleSaveMasterPart} className="space-y-3">
                                            <div>
                                                <label className="block text-[11px] font-bold mb-1">Part Name</label>
                                                <input type="text" value={newPartName} onChange={(e) => setNewPartName(e.target.value)} placeholder="e.g. 10kW Hybrid Inverter" className="w-full px-3 py-2 border rounded text-xs bg-white" required />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-bold mb-1">SKU / Code</label>
                                                <input type="text" value={newPartSku} onChange={(e) => setNewPartSku(e.target.value)} placeholder="e.g. INV-10KW" className="w-full px-3 py-2 border rounded text-xs bg-white font-mono" />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-bold mb-1">Category</label>
                                                <select value={newPartCategory} onChange={(e) => setNewPartCategory(e.target.value)} className="w-full px-3 py-2 border rounded text-xs bg-white">
                                                    <option value="Connectors">Connectors</option>
                                                    <option value="Cabling">Cabling</option>
                                                    <option value="Inverters">Inverters</option>
                                                    <option value="Batteries">Batteries</option>
                                                    <option value="Switchgear">Switchgear</option>
                                                    <option value="Mounting">Mounting</option>
                                                    <option value="Accessories">Accessories</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-bold mb-1">Unit Type</label>
                                                <select value={newPartUnit} onChange={(e) => setNewPartUnit(e.target.value)} className="w-full px-3 py-2 border rounded text-xs bg-white">
                                                    <option value="Unit">Unit</option>
                                                    <option value="Pair">Pair</option>
                                                    <option value="Meters">Meters</option>
                                                    <option value="Each">Each</option>
                                                    <option value="Kit">Kit</option>
                                                </select>
                                            </div>
                                            <div className="flex space-x-2 pt-1">
                                                <button type="submit" className="flex-1 bg-[#1B365D] text-white py-2 rounded font-bold text-xs hover:bg-[#152a4b]">
                                                    {editingPartId !== null ? 'Update Part' : 'Add to Catalog'}
                                                </button>
                                                {editingPartId !== null && (
                                                    <button type="button" onClick={() => { setEditingPartId(null); setNewPartName(''); setNewPartSku(''); }} className="px-3 bg-gray-200 text-gray-700 py-2 rounded font-bold text-xs">
                                                        Cancel
                                                    </button>
                                                )}
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'swms' && isAdmin && (
                            <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-6">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-sm font-bold uppercase text-[#1B365D]">🛡️ Master SWMS Template Library</h3>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="space-y-4">
                                        <h4 className="text-xs font-bold text-gray-500 uppercase">Available Safety Protocols</h4>
                                        {swmsTemplates.map((swms, i) => (
                                            <div key={i} className="p-4 bg-gray-50 border rounded-xl space-y-2">
                                                <h5 className="font-bold text-sm text-[#1B365D]">{swms.title}</h5>
                                                <p className="text-xs text-gray-600"><strong>Key Hazards:</strong> {swms.hazards.join(', ')}</p>
                                                <p className="text-xs text-gray-600"><strong>Control Steps:</strong> {swms.steps.length} mandatory checkpoints</p>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="bg-amber-50/50 p-5 rounded-xl border border-amber-200 space-y-3">
                                        <h4 className="text-xs font-bold text-amber-900 uppercase">Compliance Verification</h4>
                                        <p className="text-xs text-gray-700 leading-relaxed">
                                            When dispatching jobs in the schedule, supervisors can attach any of these master templates. Assigned technicians are required to review the checklist hazards and sign off prior to commencing on-site electrical works.
                                        </p>
                                    </div>
                                </div>
                            </div>
                        )}

                        {activeTab === 'team' && isAdmin && (
                            <div className="bg-white p-6 rounded-xl border border-gray-200 shadow-sm space-y-6">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-sm font-bold uppercase text-[#1B365D]">Crew Roster & Access Control</h3>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="space-y-3">
                                        <h4 className="text-xs font-bold text-gray-500 uppercase">Active Team Members</h4>
                                        {teamMembers.map((m, i) => (
                                            <div key={i} className={`flex justify-between items-center p-3 border rounded-xl text-xs ${m.color}`}>
                                                <div>
                                                    <strong>{m.name}</strong> — <span className="opacity-80">{m.role}</span>
                                                </div>
                                                <div className="flex items-center space-x-2">
                                                    <span className="px-2 py-0.5 rounded font-bold bg-white/60">
                                                        {m.access}
                                                    </span>
                                                    <button onClick={() => handleEditStaff(i)} className="text-blue-600 hover:text-blue-800 font-bold px-1.5 py-0.5 bg-white/80 rounded">Edit</button>
                                                    <button onClick={() => handleDeleteStaff(m.name)} className="text-red-500 hover:text-red-700 font-bold px-1">&times;</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="bg-gray-50 p-4 rounded-xl border space-y-3">
                                        <h4 className="text-xs font-bold text-[#1B365D] uppercase">
                                            {editingIndex !== null ? `Edit Member: ${teamMembers[editingIndex]?.name}` : 'Add New Team Member'}
                                        </h4>
                                        <form onSubmit={handleSaveStaff} className="space-y-3">
                                            <div>
                                                <label className="block text-[11px] font-bold mb-1">Full Name</label>
                                                <input type="text" value={newStaffName} onChange={(e) => setNewStaffName(e.target.value)} placeholder="e.g. Sarah Connor" className="w-full px-3 py-2 border rounded text-xs bg-white" required />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-bold mb-1">Role / Trade</label>
                                                <input type="text" value={newStaffRole} onChange={(e) => setNewStaffRole(e.target.value)} placeholder="e.g. Electrician" className="w-full px-3 py-2 border rounded text-xs bg-white" />
                                            </div>
                                            <div>
                                                <label className="block text-[11px] font-bold mb-1">Access Level</label>
                                                <select value={newStaffAccess} onChange={(e) => setNewStaffAccess(e.target.value)} className="w-full px-3 py-2 border rounded text-xs bg-white">
                                                    <option value="Field Tech">Field Tech</option>
                                                    <option value="Admin">Admin</option>
                                                </select>
                                            </div>
                                            <div className="flex space-x-2">
                                                <button type="submit" className="flex-1 bg-[#1B365D] text-white py-2 rounded font-bold text-xs hover:bg-[#152a4b]">
                                                    {editingIndex !== null ? 'Update Member' : 'Add Staff Member'}
                                                </button>
                                                {editingIndex !== null && (
                                                    <button type="button" onClick={() => { setEditingIndex(null); setNewStaffName(''); setNewStaffRole('Electrician'); }} className="px-3 bg-gray-200 text-gray-700 py-2 rounded font-bold text-xs">
                                                        Cancel
                                                    </button>
                                                )}
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* JOB DETAILS MODAL */}
                    {selectedJob && (() => {
                        const template = swmsTemplates.find(s => s.title === selectedJob.swmsTemplateTitle) || swmsTemplates[1];
                        return (
                            <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 overflow-y-auto">
                                <div className="bg-white rounded-xl shadow-2xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                                    <div className="flex justify-between items-start border-b pb-3">
                                        <div>
                                            <span className="text-xs font-bold text-[#00AEEF]">{selectedJob.id}</span>
                                            <h3 className="font-bold text-base text-[#1B365D]">{selectedJob.title}</h3>
                                            <p className="text-xs text-gray-700 font-semibold">{selectedJob.client}</p>
                                            <div className="flex items-center space-x-2 mt-1">
                                                <span className="text-xs text-gray-500">📍 {selectedJob.address}</span>
                                                <button 
                                                    onClick={() => openGoogleMaps(selectedJob.address)}
                                                    className="bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold px-2 py-0.5 rounded text-[10px] flex items-center gap-1 shadow-2xs"
                                                >
                                                    🧭 Directions
                                                </button>
                                            </div>
                                        </div>
                                        <button onClick={() => setSelectedJob(null)} className="text-gray-400 hover:text-gray-600 text-lg font-bold">&times;</button>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3 bg-gray-50 p-3 rounded-lg border">
                                        <div>
                                            <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Scheduled Date</label>
                                            <input 
                                                type="date" 
                                                value={selectedJob.date} 
                                                onChange={(e) => handleUpdateJobInModal({...selectedJob, date: e.target.value})}
                                                className="w-full px-2 py-1.5 border rounded text-xs bg-white font-semibold"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Primary Tech (Color)</label>
                                            <select 
                                                value={selectedJob.primaryTech || ''} 
                                                onChange={(e) => handleUpdateJobInModal({...selectedJob, primaryTech: e.target.value})}
                                                className="w-full px-2 py-1.5 border rounded text-xs bg-white font-semibold"
                                            >
                                                <option value="">-- Unassigned --</option>
                                                {teamMembers.map(m => <option key={m.name} value={m.name}>{m.name}</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-[10px] font-bold uppercase text-gray-500 mb-1">Assigned Crew Members</label>
                                            <div className="bg-white p-1.5 border rounded text-xs max-h-24 overflow-y-auto space-y-1">
                                                {teamMembers.map(m => {
                                                    const isChecked = selectedJob.assignedTechs?.includes(m.name);
                                                    return (
                                                        <label key={m.name} className="flex items-center space-x-2 text-[11px] cursor-pointer">
                                                            <input 
                                                                type="checkbox" 
                                                                checked={isChecked}
                                                                onChange={(e) => {
                                                                    let updatedTechs = [...(selectedJob.assignedTechs || [])];
                                                                    let updatedSigs = { ...(selectedJob.swmsSignatures || {}) };
                                                                    if (e.target.checked) {
                                                                        if (!updatedTechs.includes(m.name)) updatedTechs.push(m.name);
                                                                        if (!updatedSigs[m.name]) updatedSigs[m.name] = { signed: false, timestamp: '' };
                                                                    } else {
                                                                        updatedTechs = updatedTechs.filter(t => t !== m.name);
                                                                        delete updatedSigs[m.name];
                                                                    }
                                                                    handleUpdateJobInModal({...selectedJob, assignedTechs: updatedTechs, swmsSignatures: updatedSigs});
                                                                }}
                                                            />
                                                            <span>{m.name}</span>
                                                        </label>
                                                    );
                                                })}
                                            </div>
                                        </div>
                                    </div>

                                    {/* ON-SITE TRACKING */}
                                    <div className="space-y-2 bg-gray-50 p-4 rounded-xl border">
                                        <h4 className="font-bold text-xs uppercase text-[#1B365D]">⏱️ On-Site Time Tracking</h4>
                                        <div className="grid grid-cols-2 gap-3">
